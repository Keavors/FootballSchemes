# Сайт «Установки» на GitHub Pages: каждый пуш в main собирает приложение и выкладывает его.
name: Сайт

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка
        run: node build.js --version=$(date -u +%Y.%m.%d)-${{ github.run_number }}
      - name: Файл приложения и презентация «Маятник» — рядом с сайтом
        run: |
          cp dist/ustanovka.html dist/site/ustanovka.html
          cp mayatnik-taktika-8x8.html dist/site/mayatnik-taktika-8x8.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тесты
        run: npm test
