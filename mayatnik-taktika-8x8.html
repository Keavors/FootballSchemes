<style>html,body{margin:0;height:100%;background:#edf1ee}#te-root{height:100vh;height:100dvh}

.te-app{--te-bg:#edf1ee;--te-deep:#dde4e0;--te-ink:#1f2a44;--te-ink2:#56617a;--te-rule:#c9d2cd;--te-accent:#ff7a00;--te-accent-text:#c75300;
  --te-head:'Oswald','Arial Narrow','Roboto Condensed','DejaVu Sans Condensed',sans-serif;--te-body:'PT Sans','Segoe UI',Roboto,Arial,sans-serif;--te-hand:'Caveat','Oswald','Arial Narrow',sans-serif;
  position:relative;height:100%;display:flex;flex-direction:column;background:var(--te-bg);color:var(--te-ink);font:400 16px/1.5 var(--te-body);-webkit-font-smoothing:antialiased;overflow:hidden}
.te-theme-night{--te-bg:#111a16;--te-deep:#1b2621;--te-ink:#e9f0ea;--te-ink2:#9db0a5;--te-rule:#2d3b34}
.te-theme-paper{--te-bg:#ffffff;--te-deep:#eef1f0;--te-ink:#15181e;--te-ink2:#5b6370;--te-rule:#dde2e5}
.te-font-bold{--te-head:'Russo One','Arial Black',sans-serif;--te-body:'Rubik','Segoe UI',Roboto,Arial,sans-serif}
.te-font-clean{--te-head:'Rubik','Segoe UI',Roboto,Arial,sans-serif;--te-body:'Rubik','Segoe UI',Roboto,Arial,sans-serif}
.te-app *{box-sizing:border-box}
.te-app button{font:inherit;color:inherit}
.te-app button:focus-visible{outline:3px solid var(--te-accent);outline-offset:2px}
.te-top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--te-rule)}
.te-logo{display:flex;align-items:center;gap:9px;font:600 18px/1.1 var(--te-head);min-width:0}
.te-logo i{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:var(--te-accent)}
.te-logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

"style":"dashed","color":"special","width":2.8},{"id":"iige3t7q","kind":"move","target":"LM","head":true,"bend":0,"style":"dashed","color":"auto","width":2.8},{"id":"k6u91zyu","kind":"move","target":"ST","head":true,"bend":0,"style":"dashed","color":"auto","width":2.8},{"id":"t6ns16oz","kind":"move","target":"RM","head":true,"bend":0,"style":"dashed","color":"auto","width":2.8}],"zones":[{"id":"hwtvfv4f","type":"link","ids":["LB","LC","RC","RB"],"color":"#ffffff","label":"4","lpos":"margin"},{"id":"9vlsil2r","type":"link","ids":["LM","RM"],"color":"#ffffff","label":"2","lpos":"margin"},{"id":"cquazobi","type":"link","ids":["ST"],"color":"#ffffff","label":"1","lpos":"margin"}],"bubbles":[],"ord":{},"cap":"Не забили — все бегом домой. Маятник качнулся обратно: снова **4-2-1**.","chapter":"","dur":1400,"hold":2600}],"autoplay":true,"loop":true,"still":false,"legend":true,"grid":"none","view":{"orientation":"inherit","part":"inherit"},"gridShow":"editor"},"hidden":false,"roles":[],"cap1":"","cap2":""},{"id":"pe4b98he","layout":"text","nav":"Как мы играем","title":"Как мы играем","subtitle":"Пять фаз. Большую часть матча мяч у соперника — это не беда, а наш план.","body":"1. **Оборона 4-2-1.** Компактный блок у центра поля. Мяч сопернику отдаём у его ворот, центр и спину — нет.\n2. **Маятник и ловушка.** Мяч на фланге — латераль выходит, трое страхуют лесенкой, полузащитник и нападающий закрывают пасы. Зажали — отбор.\n3. **Контратака вчетвером — до 10 секунд.** Первый пас вперёд: латераль по флангу, в штрафной двое, один на подборе. Сзади трое.\n4. **Позиционная атака 3-3-1.** Соперник успел вернуться — «Держим!», перестраиваемся и терпеливо ищем фланг и подбор.\n5. **Потеря.** Ближний задерживает, остальные «Домой!» — через 5–6 секунд снова 4-2-1.\n\n> Формула на весь матч: без мяча **4-2-1**, с мячом **3-3-1**, сзади **всегда трое**.","side":"left","board":null,"hidden":false,"roles":[],"cap1":"","cap2":""},{"id":"0dr3e9yx","layout":"roles","nav":"Кто есть кто","title":"Кто есть кто и что от кого требуется","subtitle":"Нажмите на позицию — на схеме подсветятся её игроки.","body":"Буквы на фишках одинаковые на всех схемах: **ВР** вратарь, **ЛЛ** и **ПЛ** латерали, **ЛЦ** и **ПЦ** центральные защитники, **ЛП** и **ПП** центральные полузащитники, **Н** нападающий.","side":"left","board":{"entities":[{"id":"GK","kind":"ours","label":"ВР","number":"1","gk":true},{"id":"LB","kind":"ours","label":"ЛЛ","number":"3","gk":false},{"id":"LC","kind":"ours","label":"ЛЦ","number":"5","gk":false},{"id":"RC","kind":"ours","label":"ПЦ","number":"4","gk":false},{"id":"RB","kind":"ours","label":"ПЛ","number":"2","gk":false},{"id":"LM","kind":"ours","label":"ЛП","number":"8","gk":false},{"id":"RM","kind":"ours","label":"ПП","number":"6","gk":false},{"id":"ST","kind":"ours","label":"Н","number":"9","gk":false}],"frames":[{"id":"iiwc9ci5","pos":{"GK":[50,94],"LB":[17,70],"LC":[38,73],"RC":[62,73],"RB":[83,70],"LM":[40,59],"RM":[60,59],"ST":[50,46]},"ball":null,"hl":[],"dim":[],"focus":[],"arrows":[],"zones":[{"id":"ogxblkfi","type":"link","ids":["LB","LC","RC","RB"],"color":"#ffffff","label":"4","lpos":"margin"},{"id":"ionvlxgv","type":"link","ids":["LM","RM"],"color":"#ffffff","label":"2","lpos":"margin"},{"id":"unss99vi","type":"link","ids":["ST"],"color":"#ffffff","label":"1","lpos":"margin"}],"bubbles":[],"ord":{},"cap":"","chapter":"","dur":1100,"hold":2000}],"autoplay":false,"loop":false,"still":true,"legend":true,"grid":"none","view":{"orientation":"inherit","part":"inherit"},"gridShow":"editor"},"roles":[{"id":"u6wvt6xf","title":"Вратарь","body":"**Без мяча**\n- Командует блоком: «Сдвиг!», «Мой!», «Домой!» — ему видно всё поле.\n- Стоит высоко и забирает пробросы за спину защитников.\n\n**В контратаке**\n- Поймал мяч — сразу ищет свободного: рукой на латераля или ногой за спину их защитникам.\n\n**В позиционной атаке**\n- Начинает розыгрыш: трое сзади раздвигаются, вратарь отдаёт свободному.\n- Страхует за спиной у трёх защитников, которые поднялись к центру поля.\n\n**Что нужно:** голос, игра на выходах, точный ввод мяча рукой и ногой.","ids":["GK"]},{"id":"w6xk0zuy","title":"Центральные защитники","body":"**Без мяча**\n- Держат линию в 16 метрах от ворот — перед штрафной, а не в ней.\n- Латераль вышел на мяч — ближний центральный встаёт у него за спиной наискосок и кричит «Сдвиг!».\n- Из линии выходят только на приём спиной к воротам — второй тут же страхует.\n\n**В контратаке**\n- Первый пас — вперёд, в одно-два касания.\n- Вперёд не уходят: вместе со вторым латералем это трое, которые стоят всегда.\n- Поднимаются вслед за атакой до середины нашей половины.\n\n**В позиционной атаке**\n- Стоят у центральной линии, спокойно перекатывают мяч и ищут свободного.\n- Кричат «Меняемся!», когда мяч надолго ушёл на другой фланг.\n- Потеря — первыми встречают нападающего соперника.\n\n**Что нужно:** единоборства и игра головой, терпение, точный пас.","ids":["LC","RC"]},{"id":"gatfg46g","title":"Латерали — маятники","body":"**Без мяча**\n- Мяч на твоём фланге — выходишь на игрока с мячом и прижимаешь его к бровке.\n- Мяч на другом фланге — подтягиваешься к центру и становишься третьим центральным.\n\n**В контратаке**\n- Отобрали на твоём фланге или первый пас ушёл к тебе — «Иду!» и рывок по бровке. Твоя работа — прострел или навес.\n- Отобрали на другом — «Стою!», ты третий защитник.\n- Потеря — назад на максимальной скорости: твой фланг открыт.\n\n**В позиционной атаке**\n- Верхний латераль держит ширину у бровки и уходит за спину их крайнему.\n- Нижний — третий защитник. По команде «Меняемся!» верхний возвращается, нижний поднимается.\n\n**Что нужно:** ускорение и выносливость, оборона один в один, передача на ходу.","ids":["LB","RB"]},{"id":"eo40q1o4","title":"Центральные полузащитники","body":"**Без мяча**\n- Закрывают центр: между вами и защитниками не больше 8 метров.\n- Латераль вышел на мяч — ближний полузащитник закрывает пас внутрь.\n- Приём спиной к нашим воротам — зажимаете соперника с боков.\n\n**В контратаке**\n- Полузащитник со стороны атаки — на **ближнюю штангу**.\n- Второй — на **край штрафной**: подбирает отскок, бьёт с ходу или начинает позиционную атаку.\n- Потеря — тот, кто на подборе, первым закрывает мяч.\n- У соперника впереди остались трое — второй на подбор не идёт, а остаётся сзади.\n\n**В позиционной атаке**\n- Оба между линиями соперника: открываются под пас, помогают латералю на фланге и бегут в дыру за защитником.\n\n**Что нужно:** перехваты и подбор, игра в одно касание, удар из-за штрафной.","ids":["LM","RM"]},{"id":"qx30dmhs","title":"Нападающий","body":"**Без мяча**\n- Первый защитник: встаёт между мячом и центром и направляет соперника на фланг.\n- Мяч ушёл на фланг — закрывает пас назад, ловушка захлопывается.\n- Один на защитников не бежит никогда.\n\n**В контратаке**\n- Показывается под первый пас или сразу уходит за спину защитникам.\n- Держит мяч спиной и скидывает набегающему полузащитнику.\n- На прострел — на **дальнюю штангу**.\n\n**В позиционной атаке**\n- Прижимает защитников соперника, опускается под мяч и уводит за собой защитника.\n- Опустился — остаётся на краю штрафной вместо полузащитника.\n\n**Что нужно:** рывок, игра спиной к воротам, хладнокровие: моментов будет немного.","ids":["ST"]}],"hidden":false,"cap1":"","cap2":""},{"id":"hk3il9aa","layout":"split","nav":"Без мяча: 4-2-1","title":"Без мяча: отдаём мяч, не отдаём пространство","subtitle":"Соперник может катать мяч сколько угодно. Опасны только пас в центр и пас за спину.","body":"- **Семеро — одно целое.** От нападающего до защитников около 16 метров, между линиями — не больше 8.\n- **Первая линия — у центра поля.** Их защитникам мяч отдаём, дальше в центр не пускаем.\n- **Весь блок качается за мячом.** Мяч ушёл в сторону — сдвинулись все семеро, дальний латераль подтянулся к центру.\n- **Центр закрыт всегда.** Пусть играют по флангу — там у нас ловушка.\n- **Никто не выходит без сигнала.** Одиночный прессинг только открывает дыру за спиной.","side":"left","board all":{"owner":"omc"},"hl":[],"dim":[],"focus":[],"arrows":[{"id":"n5lcafbo","kind":"line","from":{"e":"RB"},"to":{"p":[52,12]},"head":true,"bend":0,"style":"solid","color":"pass","width":3},{"id":"2eup09vg","kind":"line","from":{"p":[55,15]},"to":{"e":"omc"},"head":true,"bend":0,"style":"solid","color":"opp","width":3,"ord":2},{"id":"o0fqq04s","kind":"line","from":{"e":"of"},"to":{"p":[46,66]},"head":true,"bend":0,"style":"dashed","color":"opp","width":2.8,"ord":2}],"zones":[],"bubbles":[],"ord":{},"cap":"Защитник выбивает на край — а там соперник. Отскок его, и контратака против наших троих.","chapter":"","dur":1100,"hold":2600}],"autoplay":false,"loop":false,"still":false,"legend":true,"grid":"none","view":{"orientation":"inherit","part":"inherit"},"gridShow":"editor"},"hidden":false,"roles":[],"cap1":"","cap2":""},{"id":"qfcfgc55","layout":"text","nav":"Команды голосом","title":"Голос — половина схемы","subtitle":"Маятник работает, только если все слышат, что происходит. Восемь коротких команд — одни и те же на каждой игре.","body":"!!Мой!!! :: **Кто выходит на мяч.** Я атакую игрока с мячом — остальные страхуют.\n!!Сдвиг!!! :: **Центральный защитник.** Линия сдвигается к мячу лесенкой.\n!!Пошли!!! :: **Кто отобрал или первым увидел.** Контратака: четверо вперёд.\n!!Иду!!! :: **Латераль фланга отбора.** Я ухожу по флангу.\n!!Стою!!! :: **Второй латераль.** Остаюсь третьим защитником.\n!!Держим!!! :: **Игрок с мячом или вратарь.** Контратака не вышла — перестраиваемся в 3-3-1.\n!!Меняемся!!! :: **Центральный защитник.** Мяч надолго ушёл на другой фланг — латерали меняются местами.\n!!Домой!!! :: **Вратарь или центральный защитник.** Потеря — все бегом в 4-2-1.","side":"left","board":null,"hidden":false,"roles":[],"cap1":"","cap2":""},{"id":"cekhelnj","layout":"text","nav":"По ситуации","title":"Как меняем игру по ситуации","subtitle":"Модель та же — меняется высота блока, число атакующих и терпение в позиционной атаке.","body":"Ведём в счёте :: Блок на 5 метров ниже. В контратаке трое: полузащитник на подбор не идёт. В позиционной атаке больше держим мяч, чем рискуем.\nНичья :: Играем как обычно. Не раскрываемся ради гола — контратака сама даст момент.\nПроигрываем :: Первая линия выше центра поля, выходим на мяч раньше. В позиционной атаке трое сзади стоят на центральной линии, «Меняемся!» не кричим — верхний латераль остаётся наверху.\nСоперник бьёт длинными :: Защитники на пару метров глубже, вратарь страхует за спиной, полузащитники подбирают отскоки.\nУ соперника быстрые нападающие :: Трое сзади не поднимаются выше середины нашей половины. Латераль бежит только после чистого отбора.\nСоперник не атакует и сам отдаёт мяч :: Больше позиционной атаки в 3-3-1, но правило «сзади трое» остаётся.\nУстали латерали :: Меняем их первыми. В позиционной атаке реже «Меняемся!» — пусть один латераль отдыхает сзади.","side":"left","board":null,"hidden":false,"roles":[],"cap1":"","cap2":""},{"id":"poqqjf9m","layout":"text","nav":"Тренировка","title":"Как отработать на тренировке","subtitle":"Шесть упражнений — от физики к игре. Первое делайте каждую тренировку.","body":"1. **Рывок после разворота** (10 минут). Старт спиной к направлению, разворот по сигналу и ускорение на 20–30 метров. 6–8 повторений с полным отдыхом. В первую очередь — латерали и нападающий.\n2. **Маятник четверых** (10 минут). Четыре защитника против трёх атакующих, мяч гоняют с фланга на фланг. Один выходит на мяч — трое сдвигаются лесенкой. Тренер останавливает и проверяет линию.\n3. **Блок против владения** (15 минут). Семь наших против восьми-девяти на половине поля. Соперник катает мяч, наши держат 4-2-1 и выходят только по сигналам. После отбора — пас в мини-ворота на центральной линии за 5 секунд.\n4. **Контратака четверо против трёх** (15 минут). Отбор у нашей штрафной: латераль по флангу, полузащитник на ближнюю, нападающий на дальнюю, второй на подбор. Догоняющий стартует через 2 секунды, на удар — 10 секунд.\n5. **Позиционная атака 3-3-1 против блока** (15 минут). Семеро против шестерых на половине поля. Гол засчитывается только после прострела с фланга или удара с подбора. Потеря — трое сзади задерживают контратаку в мини-ворота.\n6. **Стоп-кадр в двусторонке.** По свистку все замирают. Сзади трое? В штрафной двое и один на краю? Латераль вернулся в блок?","side":"left","board":null,"hidden":false,"roles":[],"cap1":"","cap2":""},{"id":"ot8u6maz","layout":"text","nav":"Плюсы и риски","title":"Честно: сильные стороны и риски","subtitle":"План рабочий, но у оборонительной игры есть цена. Лучше знать её до матча.","body":"## Что даёт такая игра\n- **Мало моментов у соперника.** Семь человек перед штрафной, центр закрыт.\n- **Играем на своей сильной стороне.** Скорость латералей и нападающего опаснее всего, когда впереди пустое поле.\n- **Соперник открывается сам.** Атакуя, он поднимает защитников и оставляет зону за спиной.\n- **Контролируемый риск.** В атаке четверо, но трое сзади на местах всегда.\n- **Экономим силы.** Спринтуем по сигналу, а не весь матч.\n||\n## Риски и что с ними делать\n- **Долго без мяча — давит на голову.** Договариваемся заранее: это наш план, а не оборона от безысходности.\n- **Удары издалека и стандарты у наших ворот.** Не фолим у штрафной, закрываем удар, отрабатываем стандарты.\n- **Латерали много спринтуют.** Меняем их чаще остальных.\n- **Позиционная атака против плотного блока — трудно.** Не бьём из безнадёжных позиций, ищем фланг и подбор.\n- **Пропустили первыми.** Одной обороной не отыграться — план на слайде «По ситуации».","side":"left","board":null,"hidden":false,"roles":[],"cap1":"","cap2":""},{"id":"twhqqs7m","layout":"text","nav":"Шпаргалка","title":"Шпаргалка","subtitle":"Если запомнить только один экран — пусть будет этот.","body":"1. Без мяча — **4-2-1 у центра поля**. Центр закрыт, фланг — ловушка.\n2. **Маятник**: латераль выходит на мяч, трое страхуют лесенкой, второй латераль — в центр.\n3. На мяч выходим **по сигналу**: пас на фланг, приём спиной, плохой приём.\n4. Отбор — !!Пошли!!! Первый пас — **вперёд**. С мячом мы в **3-3-1**.\n5. Атакуют **четверо**: латераль по флангу, полузащитник на ближнюю, нападающий на дальнюю, второй полузащитник на подбор.\n6. Стоят **трое**: два центральных и второй латераль. Всегда.\n7. **10 секунд** на удар. Не вышло — !!Держим!!! и позиционная атака. Потеря — !!Домой!!!","side":"left","board":null,"hidden":false,"roles":[],"cap1":"","cap2":""}],"v":1,"id":"r32ui536","roster":[]}</script>

function isWhite(c) { const v = rgb(c); return v[0] > 235 && v[1] > 235 && v[2] > 235; }

/* Точка на квадратичной кривой */

  }
  /* Сколько единиц картинки в одном экранном пикселе — чтобы линия была одинаковой на любом экране */
  drawScale() {
    const r = this.svg.getBoundingClientRect();
    return r.width ? this.geo.vb[2] / r.width : 1;
  }
  setSpeed(k) { this.speed = Math.max(0.25, (+this.st.anim.speed || 1) * (+k || 1)); }

  /* Вопрос перед шагом: остановиться и спросить команду */
  quizFor(i) {
    const f = this.F[i];
    return f && f.quiz && f.quiz.q ? f.quiz : null;
  }
  quizCard(i, onDone) {
    const q = this.quizFor(i);
    if (!q || !this.quizHost || this.quizEl) return false;
    const card = H('div', 'te-quiz', this.quizHost);
    H('div', 'te-quiz-q', card).textContent = q.q;
    const ans = H('div', 'te-quiz-a', card);

    ans.textContent = q.a || '';

    go.type = 'button';
    go.addEventListener('click', () => {

      this.hideQuiz();

  }
  hideQuiz() {
    if (this.quizEl) { this.quizEl.remove(); this.quizEl = null; }
  }

  /* Масштаб и сдвиг схемы в редакторе: k — во сколько раз приблизили, cx/cy — центр в координатах картинки */
  setView(k, cx, cy) {
    const vb = this.geo.vb;
    k = Math.max(1, Math.min(6, +k || 1));
    const w = vb[2] / k, hh = vb[3] / k;
    const x = Math.max(vb[0], Math.min(vb[0] + vb[2] - w, (cx == null ? vb[0] + vb[2] / 2 : cx) - w / 2));
    const y = Math.max(vb[1], Math.min(vb[1] + vb[3] - hh, (cy == null ? vb[1] + vb[3] / 2 : cy) - hh / 2));
    this.viewK = k; this.viewW = w; this.viewH = hh;
    this.svg.setAttribute('viewBox', [+x.toFixed(2), +y.toFixed(2), +w.toFixed(2), +hh.toFixed(2)].join(' '));
    return { k, cx: x + w / 2, cy: y + hh / 2 };
  }

  /* Разметка зон поля: трети, коридоры или 18 зон */
  drawGrid() {
    if (!this.gGrid) return;
    this.gGrid.textContent = '';
    const type = this.B.grid || 'none';
    if (type === 'none') return;
    if (!this.editor && this.B.gridShow !== 'always') return;
    const geo = this.geo, f = geo.f;
    const line = (x1, y1, x2, y2) => {
      const a = geo.pt(x1, y1), b = geo.pt(x2, y2);
      S('line', { x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1) }, this.gGrid);
    };
    const box = (f.box && f.box[0] ? f.box[0] : 0.56) * 100;
    const ga = (f.ga && f.ga[0] ? f.ga[0] : box / 200) * 100;
    const rows = type === 'zones18' ? [16.67, 33.33, 50, 66.67, 83.33] : (type === 'thirds' || type === 'both' ? [33.33, 66.67] : []);
    const cols = type === 'zones18' ? [33.33, 66.67] : (type === 'channels' || type === 'both' ? [50 - box / 2, 50 - ga / 2, 50 + ga / 2, 50 + box / 2] : []);
    rows.forEach(y => line(0, y, 100, y));
    cols.forEach(x => line(x, 0, x, 100));
  }

  /* Отложенное действие, которое отменяется вместе с анимацией */
  after(ms, fn) {
    const gen = this.gen;
    if (!(ms > 0)) { fn(); return; }
    setTimeout(() => { if (gen === this.gen) fn(); }, ms);
  }
  isChapterStart(i) { return !!(this.chapters && i > 0 && this.chapters.some(c => c.from === i)); }

  resolve(i) {
    const f = this.F[i] || newFrame();
    const P = {};
    for (const id in f.pos) if (f.pos[id] && this.tok[id]) P[id] = f.pos[id];
    return { f, P, ball: f.ball || null, hl: f.hl || [], dim: f.dim || [], focus: f.focus || [] };
  }

  applyClasses(st) {
    const sp = safeColor(this.st.colors.special, '#ff7a00'), spt = safeColor(this.st.colors.specialText, '#1f2a44');
    for (const id in this.tok) {
      const c = this.tok[id].classList, p = this.parts[id];

      c.toggle('dim', st.dim.indexOf(id) >= 0);
      c.toggle('hl', hl);
      c.toggle('focus', fo && !hl);
      if (p.body) p.body.style.fill = hl ? sp : p.fill;
      if (p.label) p.label.style.fill = hl ? spt : p.text;
      if (p.halo) p.halo.style.stroke = hl ? sp : fo ? '#ffffff' : 'none';
    }
  }

  /* Подсветить выбранных — для слайда с ролями */
  setHighlight(ids) {
    const st = this.resolve(this.i);
    st.hl = (ids || []).slice();
    st.focus = [];
    this.applyClasses(st);
  }

  place() {
    for (const id in this.cur) {
      const p = this.cur[id], s = this.geo.pt(p[0], p[1]), e = this.E[id];
      const rot = e && !isPlayer(e) && +e.rot ? ` rotate(${+e.rot})` : '';
      this.tok[id].setAttribute('transform', `translate(${s[0].toFixed(1)},${s[1].toFixed(1)})${rot}`);
    }
  }

  ballPt(b) {
    if (!b) return null;
    if (b.owner) {
      const p = this.cur[b.owner];
      if (!p) return null;
      const s = this.geo.pt(p[0], p[1]), o = this.radius(b.owner) * 0.82 + 1;
      return [s[0] + o, s[1] + o];
    }
    if (Array.isArray(b.at)) return this.geo.pt(b.at[0], b.at[1]);
    return null;
  }

  setBall(b, fromXY, same, k, arrow) {
    const end = this.ballPt(b);
    if (!end) { this.gBall.classList.add('gone'); this.ballXY = null; return; }
    this.gBall.classList.remove('gone');
    const moving = !!fromXY && !same;
    let p;
    if (!moving) p = end;
    else {
      const pts = arrow && Array.isArray(arrow.pts) && arrow.pts.length ? arrow.pts.map(q => this.geo.pt(q[0], q[1])) : null;
      const bend = arrow ? +arrow.bend || 0 : 0;
      const far = Math.hypot(end[0] - fromXY[0], end[1] - fromXY[1]) > 1;
      if (pts && far) p = pathAt([fromXY].concat(pts, [end]), k);
      else if (bend && far) {
        const C = bendCtrl(fromXY[0], fromXY[1], end[0], end[1], bend);
        p = quadAt(fromXY[0], fromXY[1], C[0], C[1], end[0], end[1], k);
      } else p = [fromXY[0] + (end[0] - fromXY[0]) * k, fromXY[1] + (end[1] - fromXY[1]) * k];
    }
    this.ballXY = p;
    this.gBall.setAttribute('transform', `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
    /* Навес: мяч поднимается над тенью и к концу опускается */
    if (this.gBallBody) {
      const lob = moving && arrow && arrow.lob;
      const dist = lob ? Math.hypot(end[0] - fromXY[0], end[1] - fromXY[1]) : 0;
      const lift = lob ? 4 * Math.min(46, dist * 0.26) * clamp01(k) * (1 - clamp01(k)) : 0;
      this.gBallBody.setAttribute('transform', lift > 0.1 ? `translate(0,${(-lift).toFixed(1)}) scale(${(1 + lift / 260).toFixed(3)})` : '');
      if (this.gBallShadow) this.gBallShadow.setAttribute('opacity', lift > 0.1 ? Math.max(0.3, 1 - lift / 80).toFixed(2) : '1');
    }
  }

  marker(color, w) {
    const size = Math.round(8 + w * 1.1);
    const key = color.replace(/[^a-z0-9]/gi, '').toLowerCase() + 's' + size;
    if (!this.markers[key]) {
      const id = `${this.id}-m${key}`;
      const m = S('marker', { id, viewBox: '0 0 10 10', refX: '6', refY: '5', markerWidth: size, markerHeight: size, markerUnits: 'userSpaceOnUse', orient: 'auto' }, this.defs);
      S('path', { d: 'M0,0.5 L10,5 L0,9.5 L2.6,5 z', fill: color }, m);
      this.markers[key] = id;
    }
    return `url(#${this.markers[key]})`;
  }

  arrowColor(a, st) {
    const C = this.st.colors, c = a.color || 'run';
    if (c === 'auto') {
      const id = a.kind === 'move' ? a.target : (a.from && a.from.e);
      if (id && st.hl.indexOf(id) >= 0) return C.special;
      const e = id && this.E[id];
      return e && e.kind === 'opp' ? C.oppArrow : C.run;
    }
    if (c === 'run') return C.run;
    if (c === 'pass') return C.pass;
    if (c === 'opp') return C.oppArrow;
    if (c === 'special') return C.special;
    return c;
  }

  drawArrows(f, from, to, st, animated, delayFn) {
    this.gA.textContent = '';
    this.ageo = [];
    this.apath = [];
    (f.arrows || []).forEach((a, idx) => {
      let A = null, B = null, rA = 0, rB = 0;
      if (a.kind === 'move') {
        A = from[a.target]; B = to[a.target];
        rA = rB = this.radius(a.target) + 2;
      } else {
        if (a.from && a.from.e) { A = from[a.from.e]; rA = this.radius(a.from.e) + 2; } else if (a.from && a.from.p) A = a.from.p;
        if (a.to && a.to.e) { B = to[a.to.e]; rB = this.radius(a.to.e) + 2; } else if (a.to && a.to.p) B = a.to.p;
      }

      const P0 = this.geo.pt(A[0], A[1]), P1 = this.geo.pt(B[0], B[1]);
      const mids = Array.isArray(a.pts) ? a.pts.map(q => this.geo.pt(q[0], q[1])) : [];
      const first = mids[0] || P1, last = mids.length ? mids[mids.length - 1] : P0;
      const d0 = Math.hypot(first[0] - P0[0], first[1] - P0[1]) || 1;
      const d1 = Math.hypot(P1[0] - last[0], P1[1] - last[1]) || 1;
      const dx = P1[0] - P0[0], dy = P1[1] - P0[1], len = Math.hypot(dx, dy);
      if (len < rA + rB + (this.editor ? 4 : 16) && !mids.length) return;
      const sx = P0[0] + (first[0] - P0[0]) / d0 * rA, sy = P0[1] + (first[1] - P0[1]) / d0 * rA;
      const ex = P1[0] - (P1[0] - last[0]) / d1 * rB, ey = P1[1] - (P1[1] - last[1]) / d1 * rB;
      const ux = dx / (len || 1), uy = dy / (len || 1);
      const bend = +a.bend || 0;
      const cx = (sx + ex) / 2 - uy * bend, cy = (sy + ey) / 2 + ux * bend;
      this.ageo[idx] = { sx, sy, cx, cy, ex, ey };
      const col = safeColor(this.arrowColor(a, st));
      const w = Math.max(0.5, +a.width || 3);
      const style = a.style || 'solid';
      const chain = mids.length ? [[sx, sy]].concat(mids, [[ex, ey]]) : null;
      const d = chain ? smoothPath(chain)
        : (style === 'wavy' ? wavyPath(sx, sy, cx, cy, ex, ey)

      this.apath[idx] = d;
      const g = S('g', { class: 'te-arrow' }, this.gA);
      const dl = animated && delayFn ? Math.max(0, delayFn(a) || 0) : 0;
      if (dl > 0) {
        g.style.opacity = '0';
        g.style.transition = 'opacity .2s ease-out';
        this.after(dl, () => { g.style.opacity = '1'; });
      }
      const p = S('path', { d, fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-opacity': a.opacity != null ? a.opacity : null }, g);
      const mk = () => { if (head) p.setAttribute('marker-end', this.marker(col, w)); };
      if (style === 'dashed' || style === 'dotted') {
        p.setAttribute('stroke-dasharray', style === 'dotted' ? '0.5 7' : '8 7');
        p.setAttribute('class', 'te-dash');
        mk();
      } else if (!animated || REDUCED || (style === 'wavy' && !chain) || a.draw === false) {
        mk();
      } else {
        const L = chain ? pathLength(chain) : quadLen(sx, sy, cx, cy, ex, ey);

        p.style.strokeDashoffset = L;
        p.getBoundingClientRect();
        p.style.transition = `stroke-dashoffset ${(0.45 / this.speed).toFixed(2)}s ease-out ${(dl / 1000).toFixed(2)}s`;
        p.style.strokeDashoffset = 0;
        this.after(dl + 360 / this.speed, mk);
      }
      if (this.editor) S('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': 22, 'data-aidx': idx }, g);
    });
  }

  note(parent, x, y, text, color, size) {
    const g = S('g', { transform: `translate(${(+x).toFixed(1)},${(+y).toFixed(1)})` }, parent);
    const t = S('text', { class: 'te-note', 'text-anchor': 'middle', dy: '.32em', fill: color, 'font-size': +size || 22 }, g);
    t.textContent = text;
    return g;
  }

  drawZones(f) {
    this.gZ.textContent = '';
    this.dyn = [];
    const geo = this.geo;
    (f.zones || []).forEach((z, idx) => {
      const col = safeColor(z.color || '#ffffff');
      const g = S('g', { class: 'te-zone', 'data-zidx': this.editor ? idx : null }, this.gZ);
      const fo = z.fill != null && z.fill !== '' ? +z.fill : (isWhite(col) ? 0.13 : 0.22);
      const stroke = z.stroke === 'none' ? { stroke: 'none' } : { stroke: col, 'stroke-opacity': 0.9, 'stroke-width': 2, 'stroke-dasharray': z.stroke === 'solid' ? null : '7 6' };
      const nc = noteColor(col);
      if (z.type === 'rect') {
        const a = geo.pt(+z.x || 0, +z.y || 0), b = geo.pt((+z.x || 0) + (+z.w || 0), (+z.y || 0) + (+z.h || 0));
        const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]), w = Math.abs(a[0] - b[0]), hh = Math.abs(a[1] - b[1]);
        S('rect', Object.assign({ x, y, width: w, height: hh, rx: Math.min(14, w / 4, hh / 4), fill: col, 'fill-opacity': fo }, stroke), g);
        if (z.label) {
          const ly = z.lpos === 'bottom' ? y + hh - 20 : z.lpos === 'center' ? y + hh / 2 : y + 20;
          this.note(g, x + w / 2, ly, z.label, nc, z.size);
        }
      } else if (z.type === 'ellipse') {
        const c = geo.pt(+z.cx || 0, +z.cy || 0);
        const rx = Math.abs(geo.horiz ? z.ry * geo.PL / 100 : z.rx * geo.PW / 100);
        const ry = Math.abs(geo.horiz ? z.rx * geo.PW / 100 : z.ry * geo.PL / 100);
        S('ellipse', Object.assign({ cx: c[0], cy: c[1], rx, ry, fill: col, 'fill-opacity': fo }, stroke), g);
        if (z.label) this.note(g, c[0], z.lpos === 'center' ? c[1] : z.lpos === 'top' ? c[1] - ry - 14 : c[1] + ry + 16, z.label, nc, z.size);
      } else if (z.type === 'text') {
        const c = geo.pt(+z.x || 0, +z.y || 0);
        const cls = 'te-note' + (z.font === 'head' ? ' te-note-head' : z.font === 'body' ? ' te-note-body' : '') + (z.outline === false ? ' te-note-plain' : '');
        const t = S('text', { x: c[0].toFixed(1), y: c[1].toFixed(1), dy: '.32em', 'text-anchor': 'middle', class: cls, fill: col, 'font-size': +z.size || 22 }, g);
        t.textContent = z.text || '';
      } else if (z.type === 'hull') {
        const r = S('rect', Object.assign({ rx: 26, fill: col, 'fill-opacity': z.fill != null && z.fill !== '' ? fo : 0.1 }, stroke), g);
        const lab = z.label ? S('g', null, g) : null;
        if (lab) { const t = S('text', { class: 'te-note', 'text-anchor': 'start', dy: '.32em', fill: nc, 'font-size': +z.size || 22 }, lab); t.textContent = z.label; }
        this.dyn.push(() => {
          const pts = (z.ids || []).map(id => this.cur[id]).filter(Boolean);
          if (!pts.length) { g.setAttribute('visibility', 'hidden'); return; }
          g.removeAttribute('visibility');
          let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
          pts.forEach(p => { const s = geo.pt(p[0], p[1]); x0 = Math.min(x0, s[0]); y0 = Math.min(y0, s[1]); x1 = Math.max(x1, s[0]); y1 = Math.max(y1, s[1]); });
          const pad = 26;
          r.setAttribute('x', (x0 - pad).toFixed(1)); r.setAttribute('y', (y0 - pad).toFixed(1));
          r.setAttribute('width', (x1 - x0 + 2 * pad).toFixed(1)); r.setAttribute('height', (y1 - y0 + 2 * pad).toFixed(1));
          if (lab) lab.setAttribute('transform', `translate(${(x0 - pad + 8).toFixed(1)},${(y0 - pad - 13).toFixed(1)})`);
        });
      } else if (z.type === 'link') {
        const pl = S('polyline', { fill: 'none', stroke: col, 'stroke-opacity': 0.85, 'stroke-width': +z.width || 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
        if (this.editor) S('polyline', { fill: 'none', stroke: 'transparent', 'stroke-width': 20, class: 'te-linkhit' }, g);
        let lab = null;
        const lp = z.lpos || 'margin';
        if (z.label && lp !== 'none') {
          lab = S('g', null, g);
          const t = S('text', { class: lp === 'margin' ? 'te-digit' : 'te-note', 'text-anchor': lp === 'margin' && !geo.horiz ? 'end' : 'middle', dy: '.35em', fill: lp === 'margin' ? null : nc, 'font-size': lp === 'margin' ? null : (+z.size || 22) }, lab);
          t.textContent = z.label;
        }
        this.dyn.push(() => {
          let pts = (z.ids || []).map(id => this.cur[id]).filter(Boolean);
          if (z.order !== 'given') pts = pts.slice().sort((a, b) => a[0] - b[0]);
          if (!pts.length) { g.setAttribute('visibility', 'hidden'); return; }
          g.removeAttribute('visibility');
          const S2 = pts.map(p => geo.pt(p[0], p[1]));
          const ptsAttr = S2.map(s => s[0].toFixed(1) + ',' + s[1].toFixed(1)).join(' ');
          pl.setAttribute('points', ptsAttr);
          if (this.editor) g.querySelector('.te-linkhit').setAttribute('points', ptsAttr);
          if (lab) {
            const ax = S2.reduce((s, p) => s + p[0], 0) / S2.length, ay = S2.reduce((s, p) => s + p[1], 0) / S2.length;
            const vb = geo.vb;
            if (lp === 'margin') lab.setAttribute('transform', geo.horiz ? `translate(${ax.toFixed(1)},${(vb[1] + vb[3] - 9).toFixed(1)})` : `translate(${(vb[0] + vb[2] - 3).toFixed(1)},${ay.toFixed(1)})`);
            else lab.setAttribute('transform', `translate(${ax.toFixed(1)},${(ay + (lp === 'above' ? -38 : 38)).toFixed(1)})`);
          }
        });
      } else if (z.type === 'poly') {
        const pg = S('polygon', Object.assign({ fill: col, 'fill-opacity': z.fill != null && z.fill !== '' ? fo : 0.14, 'stroke-linejoin': 'round' }, z.stroke === 'none' ? { stroke: 'none' } : { stroke: col, 'stroke-opacity': 0.75, 'stroke-width': 2, 'stroke-dasharray': z.stroke === 'dashed' ? '7 6' : null }), g);
        this.dyn.push(() => {
          const pts = (z.ids || []).map(id => this.cur[id]).filter(Boolean);
          pg.setAttribute('points', pts.map(p => geo.pt(p[0], p[1]).map(v => v.toFixed(1)).join(',')).join(' '));
        });
      } else if (z.type === 'ring') {
        const rr = +z.r || 30;
        const c = S('circle', Object.assign({ r: rr, fill: col, 'fill-opacity': z.fill != null && z.fill !== '' ? fo : 0.14 }, z.stroke === 'none' ? { stroke: 'none' } : { stroke: col, 'stroke-width': 2.2, 'stroke-dasharray': z.stroke === 'solid' ? null : '6 5' }), g);
        const lab = z.label ? S('g', null, g) : null;
        if (lab) { const t = S('text', { class: 'te-note', 'text-anchor': 'middle', dy: '.32em', fill: nc, 'font-size': +z.size || 22 }, lab); t.textContent = z.label; }
        this.dyn.push(() => {
          const p = typeof z.target === 'string' ? this.cur[z.target] : null;
          if (!p) { g.setAttribute('visibility', 'hidden'); return; }
          g.removeAttribute('visibility');
          const s = geo.pt(p[0], p[1]);
          c.setAttribute('cx', s[0].toFixed(1)); c.setAttribute('cy', s[1].toFixed(1));
          if (lab) lab.setAttribute('transform', `translate(${s[0].toFixed(1)},${(z.lpos === 'above' ? s[1] - rr - 15 : s[1] + rr + 16).toFixed(1)})`);
        });
      }
    });
  }

  drawBubbles(f) {
    this.gB.textContent = '';
    (f.bubbles || []).forEach((b, idx) => {
      const text = String(b.text || '');
      if (!text) return;
      const g = S('g', { 'data-bidx': this.editor ? idx : null }, this.gB);
      const inner = S('g', { class: 'te-bub' }, g);
      const fill = safeColor(b.color || this.st.colors.special, '#ff8a1a'), tcol = safeColor(b.textColor || '#1f2a44');
      const w = Math.max(52, text.length * 11 + 22), hh = 30, dn = !!b.below;
      if (dn) inner.style.transformOrigin = '50% 0%';
      S('rect', { x: -w / 2, y: dn ? 7 : -hh - 7, width: w, height: hh, rx: 10, fill, stroke: 'rgba(8,40,20,.35)', 'stroke-width': 1 }, inner);
      S('path', { d: dn ? 'M-7,8 L0,0 L7,8 z' : 'M-7,-8 L0,0 L7,-8 z', fill }, inner);
      const t = S('text', { class: 'te-bubtxt', 'text-anchor': 'middle', y: dn ? 7 + hh / 2 : -7 - hh / 2, dy: '.34em', fill: tcol }, inner);
      t.textContent = text;
      this.dyn.push(() => {
        const p = this.cur[b.target];
        if (!p) { g.setAttribute('visibility', 'hidden'); return; }
        g.removeAttribute('visibility');
        const s = this.geo.pt(p[0], p[1]), r = this.radius(b.target);
        g.setAttribute('transform', `translate(${s[0].toFixed(1)},${(s[1] + (dn ? r + 3 : -r - 3)).toFixed(1)})`);
      });
    });
  }

  updateDyn() { for (let k = 0; k < this.dyn.length; k++) this.dyn[k](); }

  _snap(i) {
    this.clearDrawing();
    const st = this.resolve(i);
    const prevP = (i > 0 && !this.isChapterStart(i)) ? this.resolve(i - 1).P : st.P;
    this.i = i;
    this.cur = {};
    for (const id in st.P) this.cur[id] = st.P[id].slice();
    this.applyClasses(st);
    this.place();
    this.ballOwner = st.ball && st.ball.owner ? st.ball.owner : null;
    this.setBall(st.ball, null, true, 1);
    const from = {};
    for (const id in this.cur) from[id] = prevP[id] || this.cur[id];
    this.drawArrows(st.f, from, this.cur, st, false);
    this.drawZones(st.f);
    this.drawBubbles(st.f);
    this.updateDyn();
    this.ui(i);
    if (this.opts.onRender) this.opts.onRender(this);
  }

  async tweenTo(i) {
    this.clearDrawing();
    const st = this.resolve(i);
    const from = {};
    for (const id in st.P) from[id] = this.cur[id] ? this.cur[id].slice() : st.P[id].slice();
    const fromBall = this.ballXY ? this.ballXY.slice() : null;
    const same = !!(st.ball && st.ball.owner && st.ball.owner === this.ballOwner);
    const bends = moveBends(st.f, st.P), ballBend = passBend(st.f, st.ball);
    const ord = frameOrders(st.f, st.P);
    this.i = i;
    this.applyClasses(st);
    const dur = REDUCED ? 1 : (st.f.dur || 1100) / this.speed;
    const delay = REDUCED ? 0 : ((st.f.arrows && st.f.arrows.length) ? 320 / this.speed : 0);
    const start = n => delay + (n - 1) * dur;
    this.drawArrows(st.f, from, st.P, st, true, a => start(ord.arrow[a.id] || 1) - delay);
    this.drawZones(st.f);
    this.drawBubbles(st.f);
    this.ui(i);
    const ok = await this.animate(delay + dur * ord.phases, t => {
      const next = {};
      for (const id in from) {
        const k = ease(clamp01((t - start(ord.ent[id] || 1)) / dur));
        next[id] = this.moveAt(from[id], st.P[id], bends[id], k);
      }
      this.cur = next;
      this.place();
      this.setBall(st.ball, fromBall, same, ease(clamp01((t - start(ord.ball)) / dur)), ballBend);
      this.updateDyn();
    });
    if (ok) this.ballOwner = st.ball && st.ball.owner ? st.ball.owner : null;
    return ok;
  }

  /* Сколько миллисекунд идёт переход к шагу i и сколько потом стоим на месте */
  stepMs(i) {
    if (i <= 0 || i >= this.n) return 0;
    const st = this.resolve(i);
    return (st.f.dur || 1100) * frameOrders(st.f, st.P).phases;
  }
  holdMs(i) { return (this.F[i] && this.F[i].hold) || 2000; }

  /* Показать промежуточное состояние между шагами i и i+1 — для ползунка прокрутки */
  scrubTo(i, k) {
    this.cancel();
    i = Math.max(0, Math.min(this.n - 1, i));
    this._snap(i);
    if (!(k > 0.001) || i >= this.n - 1) return;
    const st = this.resolve(i + 1);
    const from = {};
    for (const id in st.P) from[id] = this.cur[id] ? this.cur[id].slice() : st.P[id].slice();
    const fromBall = this.ballXY ? this.ballXY.slice() : null;
    const same = !!(st.ball && st.ball.owner && st.ball.owner === this.ballOwner);
    const mv = moveBends(st.f, st.P), pass = passBend(st.f, st.ball), ord = frameOrders(st.f, st.P);
    this.applyClasses(st);
    this.drawArrows(st.f, from, st.P, st, false);
    this.drawZones(st.f);
    this.drawBubbles(st.f);
    const T = ord.phases * clamp01(k);
    const cur = {};
    for (const id in from) cur[id] = this.moveAt(from[id], st.P[id], mv[id], ease(clamp01(T - ((ord.ent[id] || 1) - 1))));
    this.cur = cur;
    this.place();
    this.setBall(st.ball, fromBall, same, ease(clamp01(T - (ord.ball - 1))), pass);
    this.updateDyn();
  }

  /* Положение игрока на доле k пути: по прямой или по дуге его стрелки */
  /* Где игрок на доле k пути: по прямой, по дуге или по пути через точки */
  moveAt(a, b, arrow, k) {
    const straight = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
    if (!arrow) return straight;
    const pts = Array.isArray(arrow.pts) && arrow.pts.length ? arrow.pts : null, bend = +arrow.bend || 0;
    if (!pts && !bend) return straight;
    const g = this.geo, P0 = g.pt(a[0], a[1]), P1 = g.pt(b[0], b[1]);
    if (Math.hypot(P1[0] - P0[0], P1[1] - P0[1]) < 1) return straight;
    if (pts) {
      const s = pathAt([P0].concat(pts.map(p => g.pt(p[0], p[1])), [P1]), k);
      return g.inv(s[0], s[1]);
    }
    const C = bendCtrl(P0[0], P0[1], P1[0], P1[1], bend);
    const s = quadAt(P0[0], P0[1], C[0], C[1], P1[0], P1[1], k);
    return g.inv(s[0], s[1]);
  }

  animate(total, fn) {
    const gen = this.gen;
    return new Promise(res => {
      const t0 = performance.now();
      const step = now => {
        if (gen !== this.gen) return res(false);
        const el = now - t0;
        fn(Math.min(el, total));
        if (el < total) requestAnimationFrame(step); else res(true);
      };
      requestAnimationFrame(step);
    });
  }

  wait(ms) {
    const gen = this.gen;
    return new Promise(res => { this.tm = setTimeout(() => res(gen === this.gen), ms); });
  }

  cancel() { this.gen++; clearTimeout(this.tm); this.setPlaying(false); }

  rangeOf(i) {
    if (!this.chapters) return [0, this.n - 1];
    const c = this.chapters.find(ch => i >= ch.from && i <= ch.to) || this.chapters[0];
    return [c.from, c.to];
  }

  async play(startHold) {
    this.cancel();
    const gen = this.gen;
    this.setPlaying(true);
    const [a, b] = this.rangeOf(this.i);
    if (this.i >= b && !this.B.loop) { this._snap(a); if (!(await this.wait(800))) return; }
    if (startHold && !(await this.wait(startHold))) return;
    while (gen === this.gen) {
      let nx = this.i + 1;
      if (this.i >= b) { if (this.B.loop) nx = a; else break; }
      if (!this.quizDone[nx] && this.quizFor(nx)) {
        this.setPlaying(false);
        this.quizCard(nx, () => { this.quizDone[nx] = 1; this.play(); });
        return;
      }
      if (!(await this.tweenTo(nx))) return;
      if (!this.B.loop && nx >= b) break;
      if (!(await this.wait((this.F[nx].hold || 2000) / this.speed))) return;
    }
    if (gen === this.gen) this.setPlaying(false);
  }

  async playRange(a, b, onDone) {
    this.cancel();
    const gen = this.gen;
    this.playing = true;
    this._snap(a);
    if (!(await this.wait(450))) return;
    for (let i = a + 1; i <= b; i++) {
      if (this.isChapterStart(i)) { if (!(await this.wait(400))) return; this._snap(i); }
      else if (!(await this.tweenTo(i))) return;
      if (i < b && !(await this.wait((this.F[i].hold || 2000) / this.speed))) return;
    }
    if (!(await this.wait(700))) return;
    if (gen === this.gen) { this.playing = false; if (onDone) onDone(); }
  }

  async step(d) {
    this.cancel();
    if (d > 0) {
      if (this.i >= this.n - 1) return;
      const nx = this.i + 1;
      if (!this.quizDone[nx] && this.quizCard(nx, () => { this.quizDone[nx] = 1; this.step(1); })) return;
      if (this.isChapterStart(nx)) this._snap(nx); else await this.tweenTo(nx);
    } else {
      const pv = this.i - 1;
      if (pv < 0) return;
      if (pv === 0 || this.isChapterStart(pv)) this._snap(pv);
      else { this._snap(pv - 1); await this.tweenTo(pv); }
    }
  }

  buildUI(host) {
    const ui = H('div', 'te-sui-in', host);
    if (this.chapters) {
      const ch = H('div', 'te-chapters', ui);
      this.chipEls = this.chapters.map(c => {
        const b = H('button', 'te-chapter', ch);
        b.type = 'button';
        b.textContent = c.name;
        b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', () => { this.cancel(); this._snap(c.from); this.play(900); });
        return b;
      });
    }
    if (this.F.some(f => f.cap)) {
      const box = H('div', 'te-note-box', ui);
      box.setAttribute('aria-live', 'polite');
      this.stepEl = H('span', 'te-step', box);
      this.capEl = H('span', 'te-cap', box);
    }
    const ctrl = H('div', 'te-ctrl', ui);
    const mk = (cls, label, icon, fn) => {
      const b = H('button', cls, ctrl, icon);
      b.type = 'button';
      b.setAttribute('aria-label', label);
      b.title = label;
      b.addEventListener('click', fn);
      return b;
    };
    mk('', 'Показать сначала', ICON.restart, () => { this.cancel(); this._snap(this.rangeOf(this.i)[0]); this.play(700); });
    mk('', 'Шаг назад', ICON.back, () => this.step(-1));
    this.playBtn = mk('te-play', 'Воспроизвести', ICON.play, () => { if (this.playing) { this.cancel(); this._snap(this.i); } else this.play(); });
    mk('', 'Шаг вперёд', ICON.fwd, () => this.step(1));
    this.ticks = H('div', 'te-ticks', ctrl);
    this.ticks.setAttribute('aria-hidden', 'true');
  }

  ui(i) {
    if (!this.ticks) return;
    const [a, b] = this.rangeOf(i);
    if (this.capEl) {
      this.stepEl.textContent = `${i - a + 1}/${b - a + 1}`;
      this.capEl.innerHTML = inline(this.F[i].cap || '');
    }
    this.ticks.textContent = '';
    for (let k = a; k <= b; k++) H('i', k <= i ? 'done' : '', this.ticks);
    if (this.chipEls) {
      const cur = this.chapters.findIndex(c => i >= c.from && i <= c.to);
      this.chipEls.forEach((el, k) => el.setAttribute('aria-pressed', String(k === cur)));
    }
  }

  setPlaying(p) {
    this.playing = p;
    if (!this.playBtn) return;
    this.playBtn.innerHTML = p ? ICON.pause : ICON.play;
    this.playBtn.setAttribute('aria-label', p ? 'Пауза' : 'Воспроизвести');
    this.playBtn.title = p ? 'Пауза' : 'Воспроизвести';
  }

  enter() {
    this.cancel();
    this.quizDone = {};
    this.hideQuiz();
    this._snap(0);
    if (this.B.autoplay && this.st.anim.autoplay !== false && this.n > 1 && !this.B.still) this.play(1100);
  }
  leave() { this.cancel(); this.hideQuiz(); }
}

  /* Скорость показа */
  const SPEEDS = [0.5, 1, 1.5, 2];
  let speedK = 1;
  const speedBtn = H('button', 'te-btn te-speed-btn', top, '1×');
  speedBtn.type = 'button';
  speedBtn.title = 'Скорость анимации';
  /* Режим докладчика: заметки, таймер и следующий слайд во втором окне */

  const prog = H('div', 'te-prog', nav, '<div class="te-track"><i></i></div><span class="te-where"></span>');

  const fill = prog.querySelector('i'), where = prog.querySelector('.te-where');

  /* Панель маркера: цвет, стереть, готово */
  const MARK_COLORS = ['#ffe066', '#ff5a4e', '#ffffff'];
  let marker = false, markerColor = MARK_COLORS[0];

  const eraseBtn = H('button', 'te-btn', drawBar, 'Стереть');

  });
  /* Короткая надпись поверх показа */
  function flash(text) {
    const el = H('div', 'te-flash', app);
    el.setAttribute('role', 'status');
    el.textContent = text;
    setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
  }
  /* ---------- Режим докладчика ---------- */
  let pres = null, presTimer = 0, presT0 = 0;
  const PRES_CSS = 'body{margin:0;background:#0f1a14;color:#eaf2ec;font:16px/1.55 system-ui,Segoe UI,Roboto,Arial,sans-serif}'
    + '.w{max-width:920px;margin:0 auto;padding:18px;display:grid;gap:14px}'
    + '.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}'

    + 'h1{margin:0;font-size:26px;line-height:1.2}'
    + '#p-notes{background:#18241d;border:1px solid #2a3a31;border-radius:12px;padding:14px;min-height:150px}'
    + '#p-notes p{margin:0 0 8px}#p-notes ul,#p-notes ol{margin:0 0 8px 20px}'
    + '#p-next{color:#9db0a5}'
    + 'button{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid #3a4a41;background:#1b2621;color:inherit;font:inherit;cursor:pointer}'
    + 'button.go{border:0;background:#ff7a00;color:#1f2a44;font-weight:600}';
  const PRES_HTML = '<div class="w"><div class="row"><b id="p-num"></b><span id="p-time">00:00</span></div>'
    + '<h1 id="p-title"></h1><div id="p-notes"></div><div id="p-next"></div>'
    + '<div class="row"><button id="p-prev">← Назад</button><button id="p-step">Шаг вперёд</button>'
    + '<button id="p-go" class="go">Дальше →</button><button id="p-reset">Таймер заново</button></div></div>';
  function presUpdate() {
    if (!pres || pres.closed || !pres.document) return;
    const d = pres.document, s = P.slides[cur] || {};
    const set = (id, text) => { const el = d.getElementById(id); if (el) el.textContent = text; };
    set('p-num', `Слайд ${cur + 1} из ${N}`);

    const nx = P.slides[cur + 1];
    set('p-next', nx ? 'Дальше: ' + (plain(nx.nav || nx.title) || `слайд ${cur + 2}`) : 'Это последний слайд');
  }
  function presTick() {
    if (!pres || pres.closed || !pres.document) { clearInterval(presTimer); presTimer = 0; return; }
    const s = Math.max(0, Math.floor((Date.now() - presT0) / 1000));
    const el = pres.document.getElementById('p-time');
    if (el) el.textContent = ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function openPresenter() {
    if (pres && !pres.closed) { try { pres.focus(); } catch (e) { /* ignore */ } return; }
    try { pres = window.open('', 'ust-presenter', 'width=920,height=760'); } catch (e) { pres = null; }
    if (!pres || !pres.document) { pres = null; flash('Браузер не дал открыть второе окно — разрешите всплывающие окна'); return; }

    on('p-prev', () => go(cur - 1));

    on('p-reset', () => { presT0 = Date.now(); presTick(); });
    presT0 = Date.now();

  const boards = [];
  const N = P.slides.length;
  if (!N) H('div', 'te-empty', stage, 'В презентации пока нет слайдов.');
  P.slides.forEach((s, idx) => {
    const hasBoard = !!(s.board && s.layout !== 'text');
    const sec = H('section', 'te-slide ' + (hasBoard ? 'te-has-board' : 'te-text') + (s.layout === 'title' ? ' te-title-slide' : ''), stage);
    const label = plain(s.nav || s.title) || `Слайд ${idx + 1}`;
    sec.setAttribute('aria-label', `${idx + 1}. ${label}`);
    const inner = H('div', 'te-inner', sec);
    const brandHTML = (s.layout === 'title' && (brand.logo || brand.team))
      ? `<div class="te-brand">${brand.logo ? `<img src="${esc(brand.logo)}" alt="">` : ''}${brand.team ? `<span>${esc(brand.team)}</span>` : ''}</div>`
      : '';
    const headHTML = brandHTML + (s.title ? (s.layout === 'title' ? `<h1>${inline(s.title)}</h1>` : `<h2>${inline(s.title)}</h2>`) : '') +
      (s.subtitle ? `<p class="${s.layout === 'title' ? 'te-sub' : 'te-lead'}">${inline(s.subtitle)}</p>` : '');
    const bodyHTML = md(s.body);
    if (s.layout === 'roles' && s.board) {
      if (headHTML) H('div', 'te-head', inner, headHTML);
      const wrap = H('div', 'te-roles', inner);
      const visCol = H('div', 'te-roles-pitch', wrap);
      const bd = new Board(H('div', 'te-vis', visCol), s.board, P, {});
      boards[idx] = [bd];
      const card = H('div', 'te-roles-card', wrap);
      const chips = H('div', 'te-chapters', card);
      const ttl = H('h3', 'te-role-title', card);
      const roleBody = H('div', 'te-body te-md te-role-body', card);
      const roles = s.roles || [];
      let curRole = 0;
      const showRole = k => {
        const r = roles[k];
        if (!r) return;
        curRole = k;
        ttl.textContent = plain(r.title || '');
        roleBody.innerHTML = md(r.body || '');
        bd.setHighlight(r.ids || []);
        Array.prototype.forEach.call(chips.children, (c, n) => c.setAttribute('aria-pressed', String(n === k)));
      };
      roles.forEach((r, k) => {
        const rb = H('button', 'te-chapter', chips);
        rb.type = 'button';
        rb.textContent = plain(r.title || `Роль ${k + 1}`);
        rb.addEventListener('click', () => showRole(k));
      });
      /* вход на слайд пересобирает схему — возвращаем подсветку выбранной роли */
      const enterBase = bd.enter.bind(bd);
      bd.enter = () => { enterBase(); if (roles.length) showRole(curRole); };
      if (roles.length) showRole(0);
      const figR = slideImage(s);
      if (figR) inner.appendChild(figR);
      if (bodyHTML) H('div', 'te-body te-md', inner, bodyHTML);
    } else if (s.layout === 'duo' && s.board && s.board2) {
      if (headHTML) H('div', 'te-head', inner, headHTML);
      const duo = H('div', 'te-duo', inner);
      boards[idx] = [[s.board, s.cap1], [s.board2, s.cap2]].map(pair => {
        const col = H('div', 'te-duo-col', duo);
        if (pair[1]) H('div', 'te-duo-cap', col, inline(pair[1]));
        const vis = H('div', 'te-vis', col);
        const sui = H('div', 'te-sui', col);
        const bd = new Board(vis, pair[0], P, { uiHost: sui });
        if (!sui.childNodes.length) sui.remove();
        return bd;
      });
      const figD = slideImage(s);
      if (figD) inner.appendChild(figD);
      if (bodyHTML) H('div', 'te-body te-md', inner, bodyHTML);
    } else if (hasBoard) {
      const split = H('div', 'te-split' + (s.side === 'right' ? ' te-right' : '') + (s.layout === 'board' ? ' te-focus' : ''), inner);
      if (headHTML) H('div', 'te-head', split, headHTML);
      const vis = H('div', 'te-vis', split);
      const sui = H('div', 'te-sui', split);
      const figB = slideImage(s);
      if (figB) split.appendChild(figB);
      if (bodyHTML) H('div', 'te-body te-md', split, bodyHTML);
      boards[idx] = [new Board(vis, s.board, P, { uiHost: sui })];
      if (!sui.childNodes.length) sui.remove();
    } else if (s.image && s.image.src && s.image.place === 'side') {
      const split = H('div', 'te-split te-img-split' + (s.side === 'right' ? ' te-right' : ''), inner);
      if (headHTML) H('div', 'te-head', split, headHTML);
      const fig = slideImage(s);
      fig.className = 'te-img te-vis';
      split.appendChild(fig);
      if (bodyHTML) H('div', 'te-body te-md', split, bodyHTML);
    } else {
      if (headHTML) H('div', 'te-head', inner, headHTML);
      const figT = slideImage(s);
      if (figT) inner.appendChild(figT);
      if (bodyHTML) H('div', 'te-body te-md', inner, bodyHTML);
    }
    const li = H('li', null, tlist);
    const b = H('button', null, li);
    b.type = 'button';
    H('span', null, b).textContent = String(idx + 1);
    H('span', null, b).textContent = label;
    b.addEventListener('click', () => { closeToc(false); go(idx); });
  });

  /* Схема под пальцем: по ней рисуем и по ней же листаем шаги */
  function boardAt(target) {
    const svg = target && target.closest ? target.closest('svg.te-svg') : null;
    if (!svg) return null;
    return (boards[cur] || []).find(b => b.svg === svg) || null;
  }
  let drawing = null;
  stage.addEventListener('pointerdown', e => {
    if (!marker) return;
    const bd = boardAt(e.target);
    if (!bd) return;
    e.preventDefault();
    const p = bd.svgPoint(e.clientX, e.clientY);
    const d = `M${p[0].toFixed(1)},${p[1].toFixed(1)}`;
    const path = S('path', {
      d, fill: 'none', stroke: markerColor, 'stroke-width': (4 * bd.drawScale()).toFixed(2),
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', class: 'te-stroke'
    }, bd.drawLayer());
    drawing = { bd, path, d };
    try { stage.setPointerCapture(e.pointerId); } catch (x) { /* не поддерживается — не страшно */ }
  });
  stage.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = drawing.bd.svgPoint(e.clientX, e.clientY);
    drawing.d += `L${p[0].toFixed(1)},${p[1].toFixed(1)}`;
    drawing.path.setAttribute('d', drawing.d);
  });
  const endDraw = () => { drawing = null; };
  stage.addEventListener('pointerup', endDraw);
  stage.addEventListener('pointercancel', endDraw);
  /* Касание схемы листает шаги — когда не рисуем */
  stage.addEventListener('click', e => {
    if (marker || (e.target && e.target.closest && e.target.closest('button'))) return;
    const bd = boardAt(e.target);
    if (!bd || bd.n < 2) return;
    /* шаг вперёд сам останавливает автопоказ — тапом удобно вести разбор */
    bd.step(1);
  });

  let cur = -1;
  function go(n) {
    if (!N) return;
    n = Math.max(0, Math.min(N - 1, n));
    if (n === cur) return;
    const secs = stage.querySelectorAll('.te-slide');
    if (cur >= 0) { secs[cur].classList.remove('on'); (boards[cur] || []).forEach(b => b.leave()); }
    cur = n;
    const sec = secs[n];
    sec.classList.add('on');
    sec.scrollTop = 0;
    const body = sec.querySelector('.te-body');
    if (body) body.scrollTop = 0;
    (boards[n] || []).forEach(b => { b.clearDrawing(); b.setSpeed(speedK); b.enter(); });
    pager.textContent = `${n + 1} / ${N}`;
    fill.style.width = ((n + 1) / N * 100) + '%';
    where.textContent = plain(P.slides[n].nav || P.slides[n].title) || `Слайд ${n + 1}`;
    prevBtn.disabled = n === 0;
    nextBtn.disabled = n === N - 1;
    tlist.querySelectorAll('button').forEach((el, k) => el.setAttribute('aria-current', String(k === n)));
    if (opts.useHash) { try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) { /* sandbox */ } }
    presUpdate();
  }
  function openToc() { toc.hidden = false; const c = tlist.querySelector('[aria-current="true"]') || tlist.querySelector('button'); if (c) c.focus(); }
  function closeToc(refocus) { toc.hidden = true; if (refocus !== false) tocBtn.focus(); }
  function toggleFs() {
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
      else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } catch (e) { /* not allowed */ }
  }
  prevBtn.addEventListener('click', () => go(cur - 1));
  nextBtn.addEventListener('click', () => go(cur + 1));
  tocBtn.addEventListener('click', openToc);
  tcl.addEventListener('click', () => closeToc());
  toc.addEventListener('click', e => { if (e.target === toc) closeToc(); });
  if (fsBtn) fsBtn.addEventListener('click', toggleFs);

  const onKey = e => {
    if (!app.isConnected) return;
    if (!toc.hidden) { if (e.key === 'Escape') closeToc(); return; }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const onButton = tag === 'BUTTON';
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(N - 1); }
    else if (e.key === 'Escape' && opts.onClose) opts.onClose();
    else if (e.key === ' ' && !onButton) { const b = (boards[cur] || []).find(x => x.playBtn); if (b) { e.preventDefault(); b.playBtn.click(); } }
    else if ('fFаА'.indexOf(e.key) >= 0 && canFs) toggleFs();
    else if ('pPзЗ'.indexOf(e.key) >= 0) openPresenter();
  };
  document.addEventListener('keydown', onKey);

  let sx = 0, sy = 0, stt = 0;
  stage.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; stt = Date.now(); }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (marker) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - stt < 700) go(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  let start = opts.start || 0;
  const hashSlide = () => { const hn = parseInt((location.hash || '').replace('#', ''), 10); return hn >= 1 && hn <= N ? hn - 1 : -1; };
  const onHash = () => { const k = hashSlide(); if (k >= 0) go(k); };
  if (opts.useHash) { const k = hashSlide(); if (k >= 0) start = k; window.addEventListener('hashchange', onHash); }
  go(start);
  return {
    go,
    destroy() {
      closePresenter();
      boards.forEach(bs => (bs || []).forEach(b => b.leave()));
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('hashchange', onHash);
      rootEl.textContent = '';
    }
  };
}

root.TE = {
  version: 1, FORMATS, S, H, esc, uid, clone, mix, rgb, safeColor, isWhite, plain, inline, md,
  defaultSettings, normalizeProject, normalizeBoard, newFrame, computeChapters, makeGeo,
  isPlayer, entColors, entLabel, entRadius, EQUIP_COLOR, Board, mountPresentation, quadAt, bendCtrl, moveBends, passBend, pitchMeters, frameOrders, rosterOf, nameOf, tokenLabel,
  formatOf, normFormat, FORMAT_V, migrateProject, tooNew
};
})(window);
</script>
<script>TE.mountPresentation(document.getElementById("te-root"), JSON.parse(document.getElementById("te-data").textContent), { useHash: true });</script>
</body>
