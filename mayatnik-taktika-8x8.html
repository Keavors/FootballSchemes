 ворот, но не пускаем в центр и за спину.\n2. **Отбор по сигналу.** Пас на фланг, приём спиной, плохой приём — зажимаем вдвоём-втроём.\n3. **Контратака до 10 секунд.** Первый пас вперёд, трое бегут на ускорении, четверо страхуют.\n4. **Возврат.** Не забили — сохраняем мяч или бегом домой. Через 5–6 секунд после потери мы снова в блоке.\n\n> Наша сила — не владение, а скорость. Соперник, который держит мяч, сам поднимает защитников и оставляет за спиной пустое поле.","side":"left","board":null},{"id":"mjbn51rw","layout":"split","nav":"Кто есть кто","title":"Кто есть кто","subtitle":"Базовая расстановка — 4-2-1. Буквы на фишках одинаковые на всех схемах.","body":"- **ВР — вратарь.** Командует блоком и начинает контратаку быстрым вводом мяча.\n- **ЛЛ и ПЛ — латерали-маятники.** В обороне крайние защитники. После отбора на своём фланге латераль рвёт вперёд, второй остаётся третьим защитником.\n- **ЛЦ и ПЦ — центральные защитники.** Держат линию у штрафной и никогда не уходят вперёд.\n- **ЛП и ПП — центральные полузащитники.** Без мяча закрывают центр. После отбора ближний к мячу бежит в атаку, дальний становится опорным.\n- **Н — нападающий.** Без мяча перекрывает пас в центр, после отбора убегает за спину защитникам.\n\n4 + 2 + 1 = 7 полевых и вратарь.","side":"left","board":{"entities":[{"id":"GK","kind":"ours","label":"ВР","number":"1","gk":true},{"id":"LL","kind":"ours","label":"ЛЛ","number":"3","gk":false},{"id":"LC","kind":"ours","label":"ЛЦ","number":"5","gk":false},{"id":"RC","kind":"ours","label":"ПЦ","number":"4","gk":false},{"id":"RL","kind":"ours","label":"ПЛ","number":"2","gk":false},{"id":"LM","kind":"ours","label":"ЛП","number":"8","gk":false},{"id":"RM","kind":"ours","label":"ПП","number":"6","gk":false},{"id":"ST","kind":"ours","label":"Н","number":"9","gk":false}],"frames":[{"id":"e1mmnnnm","pos":{"GK":[50,94],"LL":[15,75],"LC":[38,78],"RC":[62,78],"RL":[85,75],"LM":[37,63],"RM":[63,63],"ST":[50,49]},"ball":null,"hl":[],"dim":[],"focus":[],"arrows":[],"zones":[{"id":"yoi3ljzo","type":"link","ids":["LL","LC","RC","RL"],"color":"#ffffff","label":"4","lpos":"margin"},{"id":"31r32wsd","type":"link","ids":["LM","RM"],"color":"#ffffff","label":"2","lpos":"margin"},{"id":"n9ufra33","type":"link","ids":["ST"],"color":"#ffffff","label":"1","lpos":"margin"}],"bubbles":[],"cap":"","chapter":"","dur":1100,"hold":2000}],"autoplay":false,"loop":false,"still":true,"legend":true}},{"id":"ksnx7lfo","layout":"text","nav":"Требования: тыл","title":"Требования к игрокам: вратарь и защитники","subtitle":"Их работа — чтобы у соперника с мячом не было ни одного свободного выхода к воротам.","body":"## Вратарь\n- **Быстрый ввод мяча.** Поймал — сразу ищет маятника или нападающего: рукой на фланг или ногой за спину защитникам соперника.\n- **Голос блока.** Видит всё поле и командует: «Сдвиг!», «Мой!», «Домой!».\n- **Играет на выходах.** Забирает пробросы за спину защитников и навесы в штрафную.\n||\n## Центральные защитники\n- **Единоборства и второй этаж.** Соперник будет навешивать и бить издалека — эти мячи наши.\n- **Терпение.** Не выпрыгивают из линии за мячом, держат зону у линии штрафной.\n- **Первый пас вперёд.** Отобрал — в одно-два касания на маятника или нападающего, без обводки.\n- **Не уходят вперёд.** Даже когда очень хочется.","side":"left","board":null},{"id":"gfis8ddd","layout":"text","nav":"Требования: бегуны","title":"Требования к игрокам: латерали, полузащита, нападение","subtitle":"Им нужно и защищаться, и за секунды переключаться в атаку. Главное качество — ускорение.","body":"## Латерали — маятники\n- **Ускорение и выносливость.** Главные бегуны команды: рывок на 30–40 метров вперёд и такой же назад.\n- **Оборона один в один.** Прижать соперника к бровке и не дать прострелить.\n- **Передача на ходу.** Контратака чаще всего заканчивается прострелом с фланга.\n- **Дисциплина.** Идёт только латераль фланга отбора, второй остаётся.\n## Нападающий\n- **Скорость и рывок за спину.** Когда соперник владеет мячом, за его защитниками много места.\n- **Держит мяч спиной к воротам**, чтобы дождаться маятника и полузащитника.\n- **Первый защитник.** Перекрывает пас в центр и направляет атаку соперника на фланг.\n- **Хладнокровие.** Моментов будет немного — каждый нужно использовать.\n||\n## Центральные полузащитники\nКто из двоих бежит в атаку, решает место отбора, поэтому оба должны уметь и то, и другое.\n- **Работа без мяча.** Закрывают центр, не дают сопернику развернуться между линиями.\n- **Тот, кто уходит.** Первым получает мяч после отбора, отдаёт вперёд в одно касание и бежит третьим в атаку.\n- **Тот, кто остаётся — опорный.** Перехваты и подстраховка. Он четвёртый страхующий и первым встречает контратаку соперника.","side":"left","board":null},{"id":"vynvsyjx","layout":"split","nav":"Оборона: блок","title":"Без мяча: отдаём мяч, не отдаём пространство","subtitle":"Соперник может катать мяч сколько угодно. Опасны только пас в центр и пас за спину.","body":"- **Семь полевых — одно целое.** От нападающего до защитников 15–20 метров, между линиями — не больше 10.\n- **Защитники — у линии штрафной**, а не внутри: иначе соперник бьёт издалека.\n- **Нападающий — первый защитник.** Не бежит к их защитникам, а встаёт между мячом и центром.\n- **Весь блок двигается вместе.** Мяч ушёл в сторону — сдвинулись все семь, дальний латераль подтянулся к центру.\n- **Никто не выходит без сигнала.** Одиночный прессинг только открывает дыру за спиной.","side":"left","board":{"entities":[{"id":"GK","kind":"ours","label":"ВР","number":"1","gk":true},{"id":"LL","kind":"ours","label":"ЛЛ","number":"3","gk":false},{"id":"LC","kind":"ours","label":"ЛЦ","number":"5","gk":false},{"id":"RC","kind":"ours","label":"ПЦ","number":"4","gk":false},{"id":"RL","kind":"ours","label":"ПЛ","number":"2","gk":false},{"id":"LM","kind":"ours","label":"ЛП","number":"8","gk":false},{"id":"RM","kind":"ours","label":"ПП","number":"6","gk":false},{"id":"ST","kind":"ours","label":"Н","number":"9","gk":false},{"id":"og","kind":"o "LL":[16,74],"LC":[38,78],"RC":[62,78],"RL":[84,74],"LM":[38,63],"RM":[62,62],"ST":[50,50],"og":[50,4],"o1":[32,14],"o2":[56,12],"o3":[74,14],"o4":[30,30],"o5":[56,44],"o6":[80,40],"o7":[50,58]},"ball":{"owner":"o7"},"hl":[],"dim":[],"focus":[],"arrows":[{"id":"1qq85i5l","kind":"move","target":"RL","head":true,"bend":0,"style":"dashed","color":"special","width":2.8}],"zones":[{"id":"cr2cazgr","type":"link","ids":["LL","LC","RC","RL"],"color":"#ffffff","label":"4","lpos":"margin"},{"id":"j4x6sgwn","type":"link","ids":["LM","RM"],"color":"#ffffff","label":"2","lpos":"margin"},{"id":"sfb4mai8","type":"link","ids":["ST"],"color":"#ffffff","label":"1","lpos":"margin"}],"bubbles":[],"cap":"Через 5–6 секунд после потери мы снова в блоке 4-2-1.","chapter":"","dur":1100,"hold":2400}],"autoplay":true,"loop":false,"still":false,"legend":true}},{"id":"zinkpapk","layout":"text","nav":"Плюсы и риски","title":"Честно: сильные стороны и риски","subtitle":"План рабочий, но у оборонительной игры есть цена. Лучше знать её до матча.","body":"## Что даёт такая игра\n- **Мало моментов у соперника.** Семь человек перед штрафной, пространства за спиной почти нет.\n- **Играем на своей сильной стороне.** Скорость латералей и нападающего опаснее всего, когда впереди пустое поле.\n- **Соперник открывается сам.** Владея мячом, он поднимает защитников и оставляет зону за спиной.\n- **Меньше риска при потере.** В контратаке рискуют трое, остальные всегда на местах.\n- **Экономим силы.** Спринтуем по сигналу, а не весь матч.\n||\n## Риски и что с ними делать\n- **Долго без мяча — давит на голову.** Договариваемся заранее: это наш план, а не оборона от безысходности.\n- **Удары издалека и стандарты у наших ворот.** Не фолим у штрафной, закрываем удар, отрабатываем стандарты.\n- **Бегуны много спринтуют.** Латералей и нападающего меняем чаще остальных.\n- **Контратак за игру немного.** Каждую доводим до удара — для этого две отработанные комбинации.\n- **Пропустили первыми.** Одной обороной не отыграться — план на слайде «По ситуации».","side":"left","board":null},{"id":"0xkikns8","layout":"split","nav":"Ошибки","title":"Ошибки, которые ломают схему","subtitle":"Первые три — на схеме, переключайте кнопками.","body":"- **Бегут все.** Сзади остаются один-два — любой длинный пас соперника становится выходом один на один.\n- **Ушли оба латераля.** Фланги пустые до самых ворот.\n- **Блок провалился в штрафную.** Соперник спокойно бьёт издалека и навешивает.\n- **Одиночный прессинг.** Один бежит к мячу без сигнала — за его спиной дыра.\n- **Медленный первый пас.** Две лишние секунды после отбора — и соперник уже вернулся.\n- **Маятник возвращается шагом.** Трое сзади долго держатся против всей атаки.","side":"left","board":{"entities":[{"id":"GK","kind":"ours","label":"ВР","number":"1","gk":true},{"id":"LC","kind":"ours","label":"ЛЦ","number":"5","gk":false},{"id":"LL","kind":"ours","label":"ЛЛ","number":"3","gk":false},{"id":"RC","kind":"ours","label":"ПЦ","number":"4","gk":false},{"id":"LM","kind":"ours","label":"ЛП","number":"8","gk":false},{"id":"RM","kind":"ours","label":"ПП","number":"6","gk":false},{"id":"RL","kind":"ours","label":"ПЛ","number":"2","gk":false},{"id":"ST","kind":"ours","label":"Н","number":"9","gk":false},{"id":"og","kind":"opp","label":"","number":"1","gk":true},{"id":"o1","kind":"opp","label":"","number":"1","gk":false},{"id":"o2","kind":"opp","label":"","number":"2","gk":false},{"id":"o3","kind":"opp","label":"","number":"3","gk":false},{"id":"o4","kind":"opp","label":"","number":"4","gk":false},{"id":"o5","kind":"opp","label":"","number":"5","gk":false},{"id":"o6","kind":"opp","label":"","number":"6","gk":false},{"id":"o7","kind":"opp","label":"","number":"7","gk":false}],"frames":[{"id":"yho36m04","pos":{"GK":[50,92],"LC":[50,68],"LL":[20,34],"RC":[70,40],"LM":[40,30],"RM":[60,28],"RL":[86,24],"ST":[48,14],"og":[50,4],"o1":[34,16],"o2":[56,12],"o3":[76,16],"o4":[26,52],"o5":[66,54],"o6":[84,48],"o7":[46,56]},"ball":{"owner":"o2"},"hl":["RL"],"dim":[],"focus":[],"arrows":[{"id":"b2lwljja","kind":"line","from":{"e":"o2"},"to":{"p":[30,72]},"head":true,"bend":0,"style":"solid","color":"opp","width":3},{"id":"yaydbcho","kind":"line","from":{"e":"o7"},"to":{"p":[32,72]},"head":true,"bend":0,"style":"dashed","color":"opp","width":2.8}],"zones":[{"id":"0wtjirbw","type":"rect","x":5,"y":52,"w":90,"h":36,"color":"#ff5a4e","label":"пусто","lpos":"bottom"}],"bubbles":[],"cap":"В контратаку убежали шестеро — сзади один защитник. Длинный пас, и соперник один на один.","chapter":"Бегут все","dur":1100,"hold":2000},{"id":"cwg6668k","pos":{"GK":[50,92],"LL":[14,30],"RL":[86,30],"LC":[40,64],"RC":[60,64],"LM":[40,50],"RM":[60,44],"ST":[50,20],"og":[50,4],"o4":[14,56],"o6":[86,56],"o7":[50,40]},"ball":{"owner":"o7"},"hl":["LL","RL"],"dim":[],"focus":[],"arrows":[{"id":"0b3n0jkr","kind":"line","from":{"e":"o7"},"to":{"p":[84,80]},"head":true,"bend":0,"style":"solid","color":"opp","width":3},{"id":"nee5m308","kind":"line","from":{"e":"o6"},"to":{"p":[88,84]},"head":true,"bend":0,"style":"dashed","color":"opp","width":2.8}],"zones":[{"id":"av2rtwni","type":"rect","x":2,"y":62,"w":28,"h":30,"color":"#ff5a4e","label":"пусто","lpos":"bottom"},{"id":"anoqz056","type":"rect","x":70,"y":62,"w":28,"h":30,"color":"#ff5a4e","label":"пусто","lpos":"bottom"}],"bubbles":[],"cap":"Ушли оба латераля — фланги пустые до самых ворот.","chapter":"Ушли оба латераля","dur":1100,"hold":2000},{"id":"131p3jcy","pos":{"GK":[50,95],"LL":[20,88],"LC":[36,90],"RC":[60,90],"RL":[80,88],"LM":[30,80],"RM":[62,80],"ST":[50,68],"og":[50,5],"o4":[30,64],"o5":[36,60],"o6":[72,64],"o7":[52,74]},"ball":{"owner":"o5"},"hl":[],"dim":[],"focus":[],"arrows":[{"id":"zch7780y","kind":"line","from":{"e":"o5"},"to":{"p":[46,99]},"head":true,"bend":0,"style":"solid","color":"opp","width":3}],"zones":[{"id":"vmusy48y","type":"rect","x":16,"y":46,"w":68,"h":26,"color":"#ff5a4e","label":"бьют издалека","lpos":"top"}],"bubbles":[],"cap":"Блок провалился в штрафную — соперник спокойно бьёт с линии и навешивает.","chapter":"Блок в штрафной","dur":1100,"hold":2000}],"autoplay":false,"loop":false,"still":false,"legend":true}},{"id":"fu6ak4yg","layout":"text","nav":"Команды голосом","title":"Голос — половина схемы","subtitle":"Перестроение работает, только если все слышат, что происходит. Семь коротких команд — одни и те же на каждой игре.","body":"!!Мой!!! :: **Кто выходит на мяч.** Я атакую игрока с мячом — второй не выходит, а страхует.\n!!Сдвиг!!! :: **Центральный защитник.** Блок смещается в сторону мяча.\n!!Пошли!!! :: **Кто отобрал или первым увидел.** Контратака: трое бегут вперёд на ускорении.\n!!Иду!!! :: **Маятник.** Я ухожу в атаку по флангу.\n!!Стою!!! :: **Второй латераль.** Остаюсь сзади третьим защитником.\n!!Держим!!! :: **Игрок с мячом или вратарь.** Контратака не вышла — сохраняем мяч, не рискуем.\n!!Домой!!! :: **Вратарь или защитник.** Потеря — все бегом в блок 4-2-1.","side":"left","board":null},{"id":"rxm8ofwm","layout":"text","nav":"По ситуации","title":"Как меняем игру по ситуации","subtitle":"Модель та же — меняется высота блока и число бегущих в контратаку.","body":"Ведём в счёте :: Блок ещё ниже. В контратаку бегут двое — нападающий и полузащитник, маятник остаётся.\nНичья :: Играем как обычно. Не раскрываемся ради гола — контратака сама даст момент.\nПроигрываем :: Поднимаем блок к центру поля и выходим на мяч раньше. В контратаку — четверо: второй полузащитник тоже бежит. Сзади остаются трое.\nСоперник играет длинными :: Защитники на пару метров глубже, вратарь страхует за спиной, полузащитники подбирают отскоки.\nУ соперника быстрые нападающие :: Опорный не уходит никогда. Латераль бежит в контратаку только после чистого отбора.\nСоперник сам отдаёт мяч :: Можно спокойно владеть в 3-3-1, но правило «сзади трое» остаётся.\nУстали латерали :: Меняем основного латераля. Контратаку чаще ведут нападающий и полузащитник.","side":"left","board":null},{"id":"rvy26mum","layout":"text","nav":"Тренировка","title":"Как отработать на тренировке","subtitle":"Четыре упражнения — от физики к игре. Первое делайте каждую тренировку.","body":"1. **Рывки после разворота** (10 минут). Старт спиной к направлению, разворот по сигналу и ускорение на 20–30 метров. 6–8 повторений с полным отдыхом. В первую очередь — латерали и нападающий.\n2. **Блок против владения** (15 минут). Семь наших против восьми-девяти на одной половине. Соперник катает мяч, наши держат 4-2-1 и выходят только по сигналам. После отбора — пас в мини-ворота на центральной линии за 5 секунд.\n3. **Контратака трое против двоих** (15 минут). Мяч получает наш защитник, трое бегут против двух защитников соперника, догоняющий стартует через 2 секунды. На удар — 10 секунд.\n4. **Стоп-кадр в двусторонке.** По свистку все замирают. Проверяем: во время контратаки сзади четверо? Бежали ровно трое? Маятник вернулся в блок?","side":"left","board":null},{"id":"gtqoblbd","layout":"text","nav":"Шпаргалка","title":"Шпаргалка","subtitle":"Если запомнить только один экран — пусть будет этот.","body":"1. Без мяча — **компактный 4-2-1** на своей половине. Мяч сопернику отдаём, центр и спину — нет.\n2. На мяч выходим только **по сигналу**: фланг, приём спиной, плохой приём.\n3. Отбор — !!Пошли!!! Первый пас — **вперёд**.\n4. Бегут **трое**: латераль фланга отбора, нападающий, ближний полузащитник.\n5. Стоят **четверо**: второй латераль, два центральных, опорный.\n6. **10 секунд** на удар. Не вышло — !!Держим!!!\n7. Потеря — ближний задерживает, остальные !!Домой!!! бегом.","side":"left","board":null}],"id":"lc41xf09"}</script>

function normalizeBoard(b) {

  if (!Array.isArray(b.frames) || !b.frames.length) b.frames = [newFrame()];
  b.frames.forEach(f => {

    ['arrows', 'zones', 'bubbles', 'hl', 'dim', 'focus'].forEach(k => { if (!Array.isArray(f[k])) f[k] = []; });

    if (typeof f.cap !== 'string') f.cap = '';

    let m;

/* ---------- Главы ---------- */
function computeChapters(frames) {
  const idx = [];
  frames.forEach((f, i) => { if (i === 0 || (f.chapter && f.chapter.trim())) idx.push(i); });
  if (idx.length <= 1) return null;
  return idx.map((from, k) => ({
    name: (frames[from].chapter || '').trim() || 'Часть ' + (k + 1),
    from,
    to: k + 1 < idx.length ? idx[k + 1] - 1 : frames.length - 1
  }));
}

/* ---------- Геометрия и поле ---------- */
function makeGeo(st) {
  const f = FORMATS[st.format] || FORMATS['8x8'];
  const ratio = +st.pitch.ratio > 0.5 ? +st.pitch.ratio : f.ratio;
  const MG = 20, PW = 360, PL = Math.round(PW * ratio);
  const horiz = st.pitch.orientation === 'horizontal';
  const VW = horiz ? PL + 2 * MG : PW + 2 * MG;
  const VH = horiz ? PW + 2 * MG : PL + 2 * MG;
  const pt = horiz
    ? (x, y) => [MG + (100 - y) * PL / 100, MG + x * PW / 100]
    : (x, y) => [MG + x * PW / 100, MG + y * PL / 100];
  const inv = horiz
    ? (sx, sy) => [(sy - MG) * 100 / PW, 100 - (sx - MG) * 100 / PL]
    : (sx, sy) => [(sx - MG) * 100 / PW, (sy - MG) * 100 / PL];
  let vb = [0, 0, VW, VH];
  const cut = MG + PL * 0.44;
  if (st.pitch.view === 'attack') vb = horiz ? [cut, 0, VW - cut, VH] : [0, 0, VW, VH - cut];
  else if (st.pitch.view === 'defence') vb = horiz ? [0, 0, VW - cut, VH] : [0, cut, VW, VH - cut];
  return { f, ratio, MG, PW, PL, horiz, VW, VH, vb, pt, inv };
}

  S('stop', { offset: '100%', 'stop-color': '#062a14', 'stop-opacity': '.3' }, vg);

  const g = S('g', { transform: geo.horiz ? `matrix(0,1,-1,0,${MG + PL},${MG})` : `translate(${MG},${MG})` }, svg);

  S('rect', A({ x: 0, y: 0, width: PW, height: PL }), g);
  S('line', A({ x1: 0, y1: PL / 2, x2: PW, y2: PL / 2 }), g);
  S('circle', A({ cx: PW / 2, cy: PL / 2, r: f.circle * PW }), g);
  S('circle', { cx: PW / 2, cy: PL / 2, r: 3, fill: lc, 'fill-opacity': 0.85 }, g);
  [0, 1].forEach(bottom => {
    const y0 = bottom ? PL : 0, d = bottom ? -1 : 1;
    const bw = f.box[0] * PW, bh = f.box[1] * PL;
    if (f.round) {

    } else {

    }
    if (f.ga) { const gw = f.ga[0] * PW, gh = f.ga[1] * PL; S('rect', A({ x: PW / 2 - gw / 2, y: bottom ? y0 - gh : y0, width: gw, height: gh }), g); }

const TEAMS = { ours: 1, opp: 1, third: 1 };

function wavyPath(x0, y0, x1, y1, x2, y2) {
  const L = quadLen(x0, y0, x1, y1, x2, y2), N = Math.max(12, Math.round(L / 2.5));

    if (i) acc += Math.hypot(x - px, y - py);
    px = x; py = y;
    const taper = Math.max(0, Math.min(1, acc / 10, (L - acc) / 14));
    const off = Math.sin(acc / 16 * Math.PI * 2) * 4 * taper;
    out += (i ? 'L' : 'M') + (x - ty / tl * off).toFixed(1) + ',' + (y + tx / tl * off).toFixed(1);
  }
  return out;
}

      const fill = safeColor(b.color || this.st.colors.special, '#ff8a1a'), tcol = safeColor(b.textColor || '#1f2a44');
      const w = Math.max(52, text.length * 11 + 22), hh = 30, dn = !!b.below;
      if (dn) inner.style.transformOrigin = '50% 0%';
      S('rect', { x: -w / 2, y: dn ? 7 : -hh - 7, width: w, height: hh, rx: 10, fill, stroke: 'rgba(8,40,20,.35)', 'stroke-width': 1 }, inner);
      S('path', { d: dn ? 'M-7,8 L0,0 L7,8 z' : 'M-7,-8 L0,0 L7,-8 z', fill }, inner);
      const t = S('text', { class: 'te-bubtxt', 'text-anchor': 'middle', y: dn ? 7 + hh / 2 : -7 - hh / 2, dy: '.34em', fill: tcol }, inner);
      t.textContent = text;
      this.dyn.push(() => {
        const p = this.cur[b.target];
        if (!p) { g.setAttribute('visibility', 'hidden'); return; }
        g.removeAttribute('visibility');
        const s = this.geo.pt(p[0], p[1]), r = this.radius(b.target);
        g.setAttribute('transform', `translate(${s[0].toFixed(1)},${(s[1] + (dn ? r + 3 : -r - 3)).toFixed(1)})`);
      });
    });
  }

  updateDyn() { for (let k = 0; k < this.dyn.length; k++) this.dyn[k](); }

  _snap(i) {
    const st = this.resolve(i);
    const prevP = (i > 0 && !this.isChapterStart(i)) ? this.resolve(i - 1).P : st.P;
    this.i = i;
    this.cur = {};
    for (const id in st.P) this.cur[id] = st.P[id].slice();
    this.applyClasses(st);
    this.place();
    this.ballOwner = st.ball && st.ball.owner ? st.ball.owner : null;
    this.setBall(st.ball, null, true, 1);
    const from = {};
    for (const id in this.cur) from[id] = prevP[id] || this.cur[id];
    this.drawArrows(st.f, from, this.cur, st, false);
    this.drawZones(st.f);
    this.drawBubbles(st.f);
    this.updateDyn();
    this.ui(i);
    if (this.opts.onRender) this.opts.onRender(this);
  }

  async tweenTo(i) {
    const st = this.resolve(i);
    const from = {};
    for (const id in st.P) from[id] = this.cur[id] ? this.cur[id].slice() : st.P[id].slice();
    const fromBall = this.ballXY ? this.ballXY.slice() : null;
    const same = !!(st.ball && st.ball.owner && st.ball.owner === this.ballOwner);
    this.i = i;
    this.applyClasses(st);
    this.drawArrows(st.f, from, st.P, st, true);
    this.drawZones(st.f);
    this.drawBubbles(st.f);
    this.ui(i);
    const dur = REDUCED ? 1 : (st.f.dur || 1100) / this.speed;
    const delay = REDUCED ? 0 : ((st.f.arrows && st.f.arrows.length) ? 320 / this.speed : 0);
    const ok = await this.animate(dur + delay, t => {
      const k = ease(clamp01((t - delay) / dur));
      const next = {};
      for (const id in from) {
        const a = from[id], b = st.P[id];
        next[id] = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
      }
      this.cur = next;
      this.place();
      this.setBall(st.ball, fromBall, same, k);
      this.updateDyn();
    });
    if (ok) this.ballOwner = st.ball && st.ball.owner ? st.ball.owner : null;
    return ok;
  }

  animate(total, fn) {
    const gen = this.gen;
    return new Promise(res => {
      const t0 = performance.now();
      const step = now => {
        if (gen !== this.gen) return res(false);
        const el = now - t0;
        fn(Math.min(el, total));
        if (el < total) requestAnimationFrame(step); else res(true);
      };
      requestAnimationFrame(step);
    });
  }

  wait(ms) {
    const gen = this.gen;
    return new Promise(res => { this.tm = setTimeout(() => res(gen === this.gen), ms); });
  }

  cancel() { this.gen++; clearTimeout(this.tm); this.setPlaying(false); }

  rangeOf(i) {
    if (!this.chapters) return [0, this.n - 1];
    const c = this.chapters.find(ch => i >= ch.from && i <= ch.to) || this.chapters[0];
    return [c.from, c.to];
  }

  async play(startHold) {
    this.cancel();
    const gen = this.gen;
    this.setPlaying(true);
    const [a, b] = this.rangeOf(this.i);
    if (this.i >= b && !this.B.loop) { this._snap(a); if (!(await this.wait(800))) return; }
    if (startHold && !(await this.wait(startHold))) return;
    while (gen === this.gen) {
      let nx = this.i + 1;
      if (this.i >= b) { if (this.B.loop) nx = a; else break; }
      if (!(await this.tweenTo(nx))) return;
      if (!this.B.loop && nx >= b) break;
      if (!(await this.wait((this.F[nx].hold || 2000) / this.speed))) return;
    }
    if (gen === this.gen) this.setPlaying(false);
  }

  async playRange(a, b, onDone) {
    this.cancel();
    const gen = this.gen;
    this.playing = true;
    this._snap(a);
    if (!(await this.wait(450))) return;
    for (let i = a + 1; i <= b; i++) {
      if (this.isChapterStart(i)) { if (!(await this.wait(400))) return; this._snap(i); }
      else if (!(await this.tweenTo(i))) return;
      if (i < b && !(await this.wait((this.F[i].hold || 2000) / this.speed))) return;
    }
    if (!(await this.wait(700))) return;
    if (gen === this.gen) { this.playing = false; if (onDone) onDone(); }
  }

  async step(d) {
    this.cancel();
    if (d > 0) {
      if (this.i >= this.n - 1) return;
      const nx = this.i + 1;
      if (this.isChapterStart(nx)) this._snap(nx); else await this.tweenTo(nx);
    } else {
      const pv = this.i - 1;
      if (pv < 0) return;
      if (pv === 0 || this.isChapterStart(pv)) this._snap(pv);
      else { this._snap(pv - 1); await this.tweenTo(pv); }
    }
  }

  buildUI(host) {
    const ui = H('div', 'te-sui-in', host);
    if (this.chapters) {
      const ch = H('div', 'te-chapters', ui);
      this.chipEls = this.chapters.map(c => {
        const b = H('button', 'te-chapter', ch);
        b.type = 'button';
        b.textContent = c.name;
        b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', () => { this.cancel(); this._snap(c.from); this.play(900); });
        return b;
      });
    }
    if (this.F.some(f => f.cap)) {
      const box = H('div', 'te-note-box', ui);
      box.setAttribute('aria-live', 'polite');
      this.stepEl = H('span', 'te-step', box);
      this.capEl = H('span', 'te-cap', box);
    }
    const ctrl = H('div', 'te-ctrl', ui);
    const mk = (cls, label, icon, fn) => {
      const b = H('button', cls, ctrl, icon);
      b.type = 'button';
      b.setAttribute('aria-label', label);
      b.title = label;
      b.addEventListener('click', fn);
      return b;
    };
    mk('', 'Показать сначала', ICON.restart, () => { this.cancel(); this._snap(this.rangeOf(this.i)[0]); this.play(700); });
    mk('', 'Шаг назад', ICON.back, () => this.step(-1));
    this.playBtn = mk('te-play', 'Воспроизвести', ICON.play, () => { if (this.playing) { this.cancel(); this._snap(this.i); } else this.play(); });
    mk('', 'Шаг вперёд', ICON.fwd, () => this.step(1));
    this.ticks = H('div', 'te-ticks', ctrl);
    this.ticks.setAttribute('aria-hidden', 'true');
  }

  ui(i) {
    if (!this.ticks) return;
    const [a, b] = this.rangeOf(i);
    if (this.capEl) {
      this.stepEl.textContent = `${i - a + 1}/${b - a + 1}`;
      this.capEl.innerHTML = inline(this.F[i].cap || '');
    }
    this.ticks.textContent = '';
    for (let k = a; k <= b; k++) H('i', k <= i ? 'done' : '', this.ticks);
    if (this.chipEls) {
      const cur = this.chapters.findIndex(c => i >= c.from && i <= c.to);
      this.chipEls.forEach((el, k) => el.setAttribute('aria-pressed', String(k === cur)));
    }
  }

  setPlaying(p) {
    this.playing = p;
    if (!this.playBtn) return;
    this.playBtn.innerHTML = p ? ICON.pause : ICON.play;
    this.playBtn.setAttribute('aria-label', p ? 'Пауза' : 'Воспроизвести');
    this.playBtn.title = p ? 'Пауза' : 'Воспроизвести';
  }

  enter() {
    this.cancel();
    this._snap(0);
    if (this.B.autoplay && this.st.anim.autoplay !== false && this.n > 1 && !this.B.still) this.play(1100);
  }
  leave() { this.cancel(); }
}

/* ---------- Режим показа ---------- */
function mountPresentation(rootEl, project, opts) {
  opts = opts || {};
  const P = normalizeProject(clone(project));
  const st = P.settings;
  rootEl.textContent = '';
  const theme = ['board', 'night', 'paper'].indexOf(st.look.theme) >= 0 ? st.look.theme : 'board';
  const font = ['sport', 'bold', 'clean'].indexOf(st.look.font) >= 0 ? st.look.font : 'sport';
  const app = H('div', `te-app te-theme-${theme} te-font-${font}`, rootEl);
  const acc = safeColor(st.look.accent, '#ff7a00');
  app.style.setProperty('--te-accent', acc);
  app.style.setProperty('--te-accent-text', theme === 'night' ? acc : mix(acc, '#000000', 0.22));

  const top = H('header', 'te-top', app);
  const logo = H('div', 'te-logo', top, '<i></i><span></span>');
  logo.querySelector('span').textContent = plain(P.title);
  H('div', 'te-grow', top);
  const pager = H('span', 'te-pager', top);
  const tocBtn = H('button', 'te-btn', top, 'Слайды');
  tocBtn.type = 'button';
  const de = document.documentElement;
  const canFs = !opts.onClose && !!(de.requestFullscreen || de.webkitRequestFullscreen);
  let fsBtn = null;
  if (canFs) { fsBtn = H('button', 'te-btn', top, ICON.fs); fsBtn.type = 'button'; fsBtn.setAttribute('aria-label', 'Во весь экран'); }
  if (opts.onClose) {
    const cb = H('button', 'te-btn', top, 'Закрыть');
    cb.type = 'button';
    cb.addEventListener('click', () => opts.onClose());
  }

  const stage = H('main', 'te-stage', app);
  const nav = H('nav', 'te-nav', app);
  nav.setAttribute('aria-label', 'Навигация по слайдам');
  const prevBtn = H('button', 'te-navbtn', nav, ICON.back);
  prevBtn.type = 'button'; prevBtn.setAttribute('aria-label', 'Предыдущий слайд');
  const prog = H('div', 'te-prog', nav, '<div class="te-track"><i></i></div><span class="te-where"></span>');
  const nextBtn = H('button', 'te-navbtn te-primary', nav, '<span>Дальше</span>' + ICON.fwd);
  nextBtn.type = 'button'; nextBtn.setAttribute('aria-label', 'Следующий слайд');
  const fill = prog.querySelector('i'), where = prog.querySelector('.te-where');

  const toc = H('div', 'te-toc', app);
  toc.hidden = true;
  const panel = H('div', 'te-toc-panel', toc);
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-label', 'Список слайдов');
  const th = H('div', 'te-toc-head', panel, '<span>Слайды</span>');
  const tcl = H('button', 'te-btn', th, 'Закрыть');
  tcl.type = 'button';
  const tlist = H('ol', null, panel);

  const boards = [];
  const N = P.slides.length;
  if (!N) H('div', 'te-empty', stage, 'В презентации пока нет слайдов.');
  P.slides.forEach((s, idx) => {
    const hasBoard = !!(s.board && s.layout !== 'text');
    const sec = H('section', 'te-slide ' + (hasBoard ? 'te-has-board' : 'te-text') + (s.layout === 'title' ? ' te-title-slide' : ''), stage);
    const label = plain(s.nav || s.title) || `Слайд ${idx + 1}`;
    sec.setAttribute('aria-label', `${idx + 1}. ${label}`);
    const inner = H('div', 'te-inner', sec);
    const headHTML = (s.title ? (s.layout === 'title' ? `<h1>${inline(s.title)}</h1>` : `<h2>${inline(s.title)}</h2>`) : '') +
      (s.subtitle ? `<p class="${s.layout === 'title' ? 'te-sub' : 'te-lead'}">${inline(s.subtitle)}</p>` : '');
    const bodyHTML = md(s.body);
    if (hasBoard) {
      const split = H('div', 'te-split' + (s.side === 'right' ? ' te-right' : '') + (s.layout === 'board' ? ' te-focus' : ''), inner);
      if (headHTML) H('div', 'te-head', split, headHTML);
      const vis = H('div', 'te-vis', split);
      const sui = H('div', 'te-sui', split);
      if (bodyHTML) H('div', 'te-body te-md', split, bodyHTML);
      boards[idx] = new Board(vis, s.board, P, { uiHost: sui });
      if (!sui.childNodes.length) sui.remove();
    } else {
      if (headHTML) H('div', 'te-head', inner, headHTML);
      if (bodyHTML) H('div', 'te-body te-md', inner, bodyHTML);
    }
    const li = H('li', null, tlist);
    const b = H('button', null, li);
    b.type = 'button';
    H('span', null, b).textContent = String(idx + 1);
    H('span', null, b).textContent = label;
    b.addEventListener('click', () => { closeToc(false); go(idx); });
  });

  let cur = -1;
  function go(n) {
    if (!N) return;
    n = Math.max(0, Math.min(N - 1, n));
    if (n === cur) return;
    const secs = stage.querySelectorAll('.te-slide');
    if (cur >= 0) { secs[cur].classList.remove('on'); if (boards[cur]) boards[cur].leave(); }
    cur = n;
    const sec = secs[n];
    sec.classList.add('on');
    sec.scrollTop = 0;
    const body = sec.querySelector('.te-body');
    if (body) body.scrollTop = 0;
    if (boards[n]) boards[n].enter();
    pager.textContent = `${n + 1} / ${N}`;
    fill.style.width = ((n + 1) / N * 100) + '%';
    where.textContent = plain(P.slides[n].nav || P.slides[n].title) || `Слайд ${n + 1}`;
    prevBtn.disabled = n === 0;
    nextBtn.disabled = n === N - 1;
    tlist.querySelectorAll('button').forEach((el, k) => el.setAttribute('aria-current', String(k === n)));
    if (opts.useHash) { try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) { /* sandbox */ } }
  }
  function openToc() { toc.hidden = false; const c = tlist.querySelector('[aria-current="true"]') || tlist.querySelector('button'); if (c) c.focus(); }
  function closeToc(refocus) { toc.hidden = true; if (refocus !== false) tocBtn.focus(); }
  function toggleFs() {
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
      else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } catch (e) { /* not allowed */ }
  }
  prevBtn.addEventListener('click', () => go(cur - 1));
  nextBtn.addEventListener('click', () => go(cur + 1));
  tocBtn.addEventListener('click', openToc);
  tcl.addEventListener('click', () => closeToc());
  toc.addEventListener('click', e => { if (e.target === toc) closeToc(); });
  if (fsBtn) fsBtn.addEventListener('click', toggleFs);

  const onKey = e => {
    if (!app.isConnected) return;
    if (!toc.hidden) { if (e.key === 'Escape') closeToc(); return; }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const onButton = tag === 'BUTTON';
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(N - 1); }
    else if (e.key === 'Escape' && opts.onClose) opts.onClose();
    else if (e.key === ' ' && !onButton) { const b = boards[cur]; if (b && b.playBtn) { e.preventDefault(); b.playBtn.click(); } }
    else if ('fFаА'.indexOf(e.key) >= 0 && canFs) toggleFs();
  };
  document.addEventListener('keydown', onKey);

  let sx = 0, sy = 0, stt = 0;
  stage.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; stt = Date.now(); }, { passive: true });
  stage.addEventListener('touchend', e => {
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - stt < 700) go(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  let start = opts.start || 0;
  const hashSlide = () => { const hn = parseInt((location.hash || '').replace('#', ''), 10); return hn >= 1 && hn <= N ? hn - 1 : -1; };
  const onHash = () => { const k = hashSlide(); if (k >= 0) go(k); };
  if (opts.useHash) { const k = hashSlide(); if (k >= 0) start = k; window.addEventListener('hashchange', onHash); }
  go(start);
  return {
    go,
    destroy() { boards.forEach(b => b && b.leave()); document.removeEventListener('keydown', onKey); window.removeEventListener('hashchange', onHash); rootEl.textContent = ''; }
  };
}

root.TE = {
  version: 1, FORMATS, S, H, esc, uid, clone, mix, rgb, safeColor, isWhite, plain, inline, md,
  defaultSettings, normalizeProject, normalizeBoard, newFrame, computeChapters, makeGeo,
  isPlayer, entColors, entLabel, entRadius, EQUIP_COLOR, Board, mountPresentation
};
})(window);
</script>
<script>TE.mountPresentation(document.getElementById("te-root"), JSON.parse(document.getElementById("te-data").textContent), { useHash: true });</script>
</body>
